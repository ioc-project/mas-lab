experiment:
  name: golden-design-space
  description: Golden capture — tutorial qa agent run (design-space lab fingerprint)
  default_flavour: local
  application:
    manifest: ../../../../../docs/tutorials/01-building-an-agent/agent.yaml
    configs_dir: ../../../../../docs/tutorials/01-building-an-agent/overlays
  scenarios:
    - id: tools
      overlays:
        logic:
          - tools
          - ref: ../../hitl-system-tools.yaml
