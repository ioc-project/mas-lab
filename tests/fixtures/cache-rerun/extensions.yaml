experiment:
  name: cache-rerun-extensions
  description: Single-run extensions smoke for trace-cache invalidation tests
  default_flavour: local
  application:
    app: trip-planner
    configs_dir: ../../../labs/extensions.lab/overlays
  scenarios:
    - id: vector-baseline
      overlays:
        logic: []
        control: []
        infra: []
  dataset:
    path: dataset.yaml
    limit: 1
  bench_emulation:
    runtime:
      cache: content-addressed
  run:
    n_runs: 1
  post:
    - name: trace-stats
      type: extract_trace_stats
      config: {}
