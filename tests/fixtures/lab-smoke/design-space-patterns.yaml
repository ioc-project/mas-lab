experiment:
  name: smoke-design-space-patterns
  description: >
    CI smoke for design-space.lab Exp 1.1 — one run, eval_mce pipeline,
    isolated trace cache (cache disabled).
  default_flavour: local
  application:
    manifest: ../../../labs/design-space.lab/apps/qa-agent/agents/qa-agent.yaml
    configs_dir: ../../../labs/design-space.lab/01-design-patterns/overlays
  scenarios:
    - id: pattern-cot
      overlays:
        logic: []
        control: []
        infra: []
  dataset:
    name: trip-planner-benchmark
    locator: samples
    limit: 1
  bench_emulation:
    runtime:
      cache: disabled
  run:
    n_runs: 1
    post:
      - name: eval-quality
        type: eval_mce
        config:
          overwrite: true
          metrics:
            - goal_success_rate
            - answer_relevancy
  post:
    - name: collect-metrics
      type: collect_metrics
      depends_on: [eval-quality]
      config:
        scenarios: [pattern-cot]
    - name: compute-ci
      type: compute_ci
      depends_on: [collect-metrics]
      config:
        data: "@collect-metrics"
        groupby: [scenario, metric]
        metrics: [answer_relevancy, goal_success_rate]
        extra_cols: [latency_s]
        ci_method: t
        ci_level: 0.95
        output: "results/ci_summary.csv"
