experiment:
  name: smoke-extensions
  description: >
    CI smoke for extensions.lab — one run, eval_mce + CI pipeline,
    isolated trace cache (cache disabled).
  default_flavour: local
  application:
    app: trip-planner
    configs_dir: ../../../labs/extensions.lab/overlays
  scenarios:
    - id: baseline
      overlays:
        logic: []
        control: []
        infra: []
  dataset:
    name: trip-planner-benchmark
    locator: samples
    limit: 1
  bench_emulation:
    runtime:
      cache: disabled
  run:
    n_runs: 1
    post:
      - name: eval-quality
        type: eval_mce
        config:
          metrics:
            - goal_success_rate
            - answer_relevancy
  post:
    - name: collect-metrics
      type: collect_metrics
      depends_on: [eval-quality]
      config:
        dataset:
          name: trip-planner-benchmark
          locator: samples
          columns: [group]
    - name: compute-ci
      type: compute_ci
      depends_on: [collect-metrics]
      config:
        data: "@collect-metrics"
        metrics:
          - goal_success_rate
          - answer_relevancy
        groupby: [scenario, group, metric]
        ci_method: t
        ci_level: 0.95
        output: "results/ci_summary.csv"
