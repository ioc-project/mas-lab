experiment:
  name: verify-lab-smoke
  description: 'CI smoke — one agent run (cache disabled) plus a lightweight post pipeline.

    '
  default_flavour: local
  application:
    manifest: ../../../docs/tutorials/01-building-an-agent/agent.yaml
    configs_dir: ../../../docs/tutorials/01-building-an-agent/overlays
  scenarios:
    - id: tools
      overlays:
        logic:
          - tools
          - ref: ../golden-runs/hitl-system-tools.yaml
        control: []
        infra: []
  dataset:
    path: dataset.yaml
    limit: 1
  bench_emulation:
    runtime:
      cache: disabled
  run:
    n_runs: 1
  post:
    - name: trace-stats
      type: extract_trace_stats
      config: {}
