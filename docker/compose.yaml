# MAS Lab local stack — UI + controller API.
#
#   cd docker && cp .env.example .env && docker compose up --build
#
# UI:  http://localhost:8080
# API: http://localhost:8090
# Both ports are published on the host's loopback only (MAS_BIND_ADDRESS, default 127.0.0.1).
#
# Mount your project at /workspace and persistent data at /data (see .env.example).
# docker/.env only fills the ${...} values below; the containers get the keys listed under
# `environment:` and nothing else. Secrets live in the file store <workspace>/.mas/secrets on the
# workspace mount: `docker compose run --rm cli mas-ctl secrets set openai` writes it to the host.

name: mas-lab

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: mas-lab-backend:local
    ports:
      - "${MAS_BIND_ADDRESS:-127.0.0.1}:${MAS_BACKEND_PORT:-8090}:8090"
    environment: &host-env
      MAS_WORKSPACE_ROOT: /workspace
      MAS_DATA_ROOT: /data
      MAS_CONTROLLER_PORT: "8090"
      MAS_LAB_ROOT: ${MAS_LAB_ROOT:-}
      MAS_LLM_VERIFY_SSL: ${MAS_LLM_VERIFY_SSL:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      # The user config mount below; not under /root, which the server's user cannot read.
      XDG_CONFIG_HOME: /config
    volumes:
      - ${MAS_WORKSPACE_MOUNT:-..}:/workspace
      - ${MAS_DATA_MOUNT:-./data}:/data
      - ${MAS_XDG_CONFIG_MOUNT:-${HOME}/.config/mas}:/config/mas:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  ui:
    build:
      context: ..
      dockerfile: docker/ui/Dockerfile
    image: mas-lab-ui:local
    ports:
      - "${MAS_BIND_ADDRESS:-127.0.0.1}:${MAS_UI_PORT:-8080}:8080"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
    depends_on:
      backend:
        condition: service_healthy

  # One-off CLI runs (benchmarks, agent runtime, ctl) — same image as backend.
  #   docker compose run --rm cli mas-lab benchmark run labs/.../experiment.yaml
  #   docker compose run --rm cli mas-ctl chat agents/simple.yaml -q "Hello"
  cli:
    profiles: [tools]
    image: mas-lab-backend:local
    environment: *host-env
    volumes:
      - ${MAS_WORKSPACE_MOUNT:-..}:/workspace
      - ${MAS_DATA_MOUNT:-./data}:/data
      - ${MAS_XDG_CONFIG_MOUNT:-${HOME}/.config/mas}:/config/mas:ro
    entrypoint: ["/usr/local/bin/mas-lab-entrypoint"]
