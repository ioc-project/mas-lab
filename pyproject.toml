[project]
name = "mas-lab"
version = "0.2.0"
description = "MAS Lab — meta-package installing the runtime, control plane, lab components, and libraries."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "mas-lab-runtime",
    "mas-lab-ctl",
    "mas-lab-component-core",
    "mas-lab-component-bench",
    "mas-lab-component-controller",
    "mas-lab-library-standard",
    "mas-lab-library-skills",
    "mas-lab-library-samples",
    "mas-lab-library-lab",
    "mas-lab-library-eval",
    "mas-lab-library-ioa[cli]",
    "mas-lab-library-telemetry",
    "mas-lab-library-kg",
]

[project.urls]
Homepage = "https://github.com/outshift-open/mas-lab"
Documentation = "https://github.com/outshift-open/mas-lab/tree/main/docs"
Issues = "https://github.com/outshift-open/mas-lab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "import-linter>=2.0",
    "httpx>=0.27",
    "ruff>=0.15.0",
    "pyarrow>=14.0",
    "hypothesis>=6.0",
]

[tool.uv.workspace]
members = [
    "runtime",
    "ctl",
    "library-standard",
    "library-skills",
    "library-samples",
    "library-lab",
    "library-eval",
    "library-ioa",
    "library-telemetry",
    "library-enforcement-proxy",
    "library-kg",
    "lab/components/core",
    "lab/components/bench",
    "lab/components/controller",
]

[tool.uv.sources]
mas-lab-runtime = { workspace = true }
mas-lab-ctl         = { workspace = true }
mas-lab-library-standard = { workspace = true }
mas-lab-library-skills   = { workspace = true }
mas-lab-library-samples  = { workspace = true }
mas-lab-library-lab      = { workspace = true }
mas-lab-library-eval     = { workspace = true }
mas-lab-library-ioa = { workspace = true }
mas-lab-library-telemetry = { workspace = true }
mas-lab-library-kg = { workspace = true }
mas-lab-component-core    = { workspace = true }
mas-lab-component-bench   = { workspace = true }
mas-lab-component-controller = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"
# Written by scripts/gen_schema_artifacts.py, which does not emit ruff style.
extend-exclude = ["**/*_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# test-only helpers shared by several test trees (the in-process SLIM node); not part of any package
pythonpath = ["tests/support"]
testpaths = ["tests", "ctl/tests", "runtime/tests", "library-ioa/tests", "lab/components/controller/tests"]
markers = [
    "timeout: per-test timeout (pytest-timeout)",
]

[tool.coverage.run]
source = [
    "mas.lab.controller",
    "mas.lab.runners",
    "mas.runtime.kernel",
    "mas.runtime.machines",
    "mas.ctl.workspace",
]
omit = [
    # PR #5 FastAPI surface — route-tested in test_fastapi_*.py (separate report)
    "*/fastapi_app.py",
    "*/http_server.py",
    "*/mas/lab/**/cli.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
