# Debugger example: the agent only defines behaviour. control.yaml holds the gdb-like debug_script,
# attached by flavour.yaml; control attach by session id.
#
#   mas-ctl validate library-standard/examples/governance/debug-script/agent.yaml
#   mas-ctl chat library-standard/examples/governance/debug-script/agent.yaml \
#     --flavour library-standard/examples/governance/debug-script/flavour.yaml
apiVersion: mas/v1
kind: Agent

metadata:
  name: debug-script-demo

spec:
  models:
    - model: gpt-4o-mini
  description: "Demo agent for gdb-like runtime debugger breakpoints on tools."
  context:
    role: |
      You are a research assistant. Use web_search for facts and calc for arithmetic.
      Remember earlier turns in the same session.
  tools:
    - ref: ./tools/web_search.tool.yaml
    - ref: ./tools/calc.tool.yaml
