[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-library-standard"
version = "0.2.0"
description = "Standard library for MAS — infra bundles, tools, and pattern aliases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mas-runtime",
    "ddgs>=9.14.0",
    "httpx>=0.27",
]

[project.entry-points."mas.runtime.manifest_libraries"]
standard = "mas.library.standard"

[tool.hatch.build]
include = [
    "src/mas/library/standard/libs/**/*.yaml",
    "src/mas/library/standard/infra/**/*.yaml",
    "src/mas/library/standard/flavours/**/*.yaml",
    "src/mas/library/standard/overlays/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]
exclude = ["src/mas/library/standard/testing"]

[tool.hatch.build.targets.sdist.force-include]
"library.yaml" = "src/mas/library/standard/library.yaml"

[tool.uv.sources]
mas-runtime = { workspace = true }
