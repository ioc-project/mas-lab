# Production guidelines, written once and attached to every agent you deploy (--control, or a Flavour's
# spec.control with agents: $all): cap LLM/tool call counts, refuse undeclared tool names, refuse leftover
# send to a dest not in this agent's delegates_to, and classify typed failures at ingress, retrying
# transient/unavailable ones. The circuit breaker is not this Control:
# include standard:llm-proxy-hardened (or standard:tool-server-hardened) on the infra pipeline.
apiVersion: control/v1
kind: Control
metadata:
  name: with-hardened
spec:
  governance:
  - gov_no_undeclared_tool
  - gov_no_undeclared_peer
  - budget:
      max_llm_calls: 50
      max_tool_calls: 100
  - retry_on_error:
      error_recovery_plugin: retry_on_error
      error_policy:
        transient: retry
        unavailable: retry
        application: allow
        fatal: block
