apiVersion: flavour/v1
kind: Flavour

metadata:
  name: prod
  description: >
    Production Flavour. require_usage is true: every agent of the session
    must have a bind chain or an agent-keyed Application row. An agent
    with none is refused.

spec:
  require_usage: true
