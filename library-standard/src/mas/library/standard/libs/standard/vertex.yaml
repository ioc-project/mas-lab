apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: vertex
  description: >
    Vertex generateContent over HTTP. Same body as gemini. Bearer token
    `{secret: vertex}`. Set project to the Google Cloud project id.

spec:
  protocol: vertex
  proxy:
    api_base: https://us-central1-aiplatform.googleapis.com
    api_key: {secret: vertex}
    project: ""
    location: us-central1
