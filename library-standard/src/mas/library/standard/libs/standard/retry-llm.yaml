apiVersion: infra/v1
kind: InfraMiddleware

metadata:
  name: retry-llm
  description: >
    Re-issue a failed live LLM call. The documented default (4 attempts, transient and unavailable); list it to tune it, or set enabled to false to turn it off.

spec:
  id: retry-llm
  layer: retry
  for: llm
  per: destination
  params:
    max_attempts: 4
