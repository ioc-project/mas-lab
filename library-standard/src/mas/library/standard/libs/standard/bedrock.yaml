apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: bedrock
  description: >
    Amazon Bedrock Converse over HTTP. Bearer token
    `{secret: bedrock}`. Point api_base at the bedrock-runtime
    host for the region.

spec:
  protocol: bedrock
  proxy:
    api_base: https://bedrock-runtime.us-east-1.amazonaws.com
    api_key: {secret: bedrock}
