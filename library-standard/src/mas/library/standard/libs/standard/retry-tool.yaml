apiVersion: infra/v1
kind: InfraMiddleware

metadata:
  name: retry-tool
  description: >
    Re-issue a failed tool call, idempotent tools only. The documented default (2 attempts); list it to tune it, or set enabled to false to turn it off.

spec:
  id: retry-tool
  layer: retry
  for: tool
  per: all
  params:
    max_attempts: 2
