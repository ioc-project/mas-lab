apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: huggingface
  description: >
    Hugging Face router. Same wire as openai. Requires HF_TOKEN.

spec:
  protocol: huggingface
  proxy:
    api_base: env:HF_API_BASE|https://router.huggingface.co/v1
    api_key_env: HF_TOKEN
