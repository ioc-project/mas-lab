apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: openrouter
  description: >
    OpenRouter chat-completions host. Same wire as openai. The key is `{secret: openrouter}`.

spec:
  protocol: openrouter
  proxy:
    api_base: https://openrouter.ai/api/v1
    api_key: {secret: openrouter}
