apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: xai
  description: >
    xAI chat-completions host. Same wire as openai. The key is `{secret: xai}`.

spec:
  protocol: xai
  proxy:
    api_base: https://api.x.ai/v1
    api_key: {secret: xai}
