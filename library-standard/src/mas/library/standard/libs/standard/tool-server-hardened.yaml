apiVersion: infra/v1
kind: ToolServerRegistry

metadata:
  name: tool-server-hardened
  description: >
    Local tool server with retry outside the circuit breaker
    (failure_threshold 5, reset_timeout_s 30, on unavailable).

spec:
  tool_servers:
    - id: local
      protocol: local
      tools_dir: tools
      skills_dir: skills
      pipeline:
        - id: retry-tool
          layer: retry
          for: [tool]
          per: all
          params:
            max_attempts: 2
            retry_on: [transient, unavailable]
            require_idempotent: true
        - id: breaker-tool
          layer: circuit_breaker
          for: [tool]
          per: destination
          params:
            failure_threshold: 5
            reset_timeout_s: 30
            "on": [unavailable]
