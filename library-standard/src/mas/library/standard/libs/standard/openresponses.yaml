apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: openresponses
  description: >
    Open Responses host (POST /responses). The key is `{secret: openresponses}`.

spec:
  protocol: openresponses
  proxy:
    api_base: https://api.openai.com/v1
    api_key: {secret: openresponses}
