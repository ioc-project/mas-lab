apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: litellm
  description: >
    Local LiteLLM proxy. Same wire as openai. Optional LITELLM_API_KEY.

spec:
  protocol: litellm
  proxy:
    api_base: env:LITELLM_HOST|http://localhost:4000/v1
    api_key_env: LITELLM_API_KEY
