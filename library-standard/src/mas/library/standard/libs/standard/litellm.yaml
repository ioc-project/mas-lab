apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: litellm
  description: >
    Local LiteLLM proxy. Same wire as openai. Optional key `{secret: litellm}`: no auth header
    is sent when it is not set.

spec:
  protocol: litellm
  proxy:
    api_base: http://localhost:4000/v1
    api_key: {secret: {name: litellm, optional: true}}
