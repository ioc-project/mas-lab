apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: databricks
  description: >
    Databricks model serving. OpenAI chat body posted at
    /serving-endpoints/{name}/invocations. Requires DATABRICKS_TOKEN
    and DATABRICKS_HOST (workspace URL).

spec:
  protocol: databricks
  proxy:
    api_base: env:DATABRICKS_HOST|
    api_key_env: DATABRICKS_TOKEN
