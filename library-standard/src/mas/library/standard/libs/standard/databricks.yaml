apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: databricks
  description: >
    Databricks model serving. OpenAI chat body posted at
    /serving-endpoints/{name}/invocations. The token is `{secret: databricks}`
    (`mas-ctl secrets set databricks`). Set api_base to the workspace URL
    with an overlay.

spec:
  protocol: databricks
  proxy:
    api_base: https://example.cloud.databricks.com
    api_key: {secret: databricks}
