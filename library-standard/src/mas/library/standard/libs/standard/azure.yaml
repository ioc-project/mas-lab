apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: azure
  description: >
    Azure OpenAI. Classic deployments post under /openai/deployments/{name}.
    A host that already ends in /v1 keeps /chat/completions. The key is
    `{secret: azure}`. Set api_base to the resource URL.

spec:
  protocol: azure
  proxy:
    api_base: https://example.openai.azure.com
    api_key: {secret: azure}
