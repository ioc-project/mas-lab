apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: groq
  description: >
    Groq chat-completions host. Same wire as openai. The key is `{secret: groq}`.

spec:
  protocol: groq
  proxy:
    api_base: https://api.groq.com/openai/v1
    api_key: {secret: groq}
