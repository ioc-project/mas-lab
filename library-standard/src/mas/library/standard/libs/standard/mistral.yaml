apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: mistral
  description: >
    Mistral chat-completions host. Same wire as openai. The key is `{secret: mistral}`.

spec:
  protocol: mistral
  proxy:
    api_base: https://api.mistral.ai/v1
    api_key: {secret: mistral}
