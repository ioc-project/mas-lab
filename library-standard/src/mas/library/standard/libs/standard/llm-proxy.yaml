apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: openai-proxy
  description: >
    OpenAI-compatible API gateway. api_base is the endpoint URL (change it
    with an overlay). The key is `{secret: openai}` (`mas-ctl secrets set openai`).

spec:
  protocol: openai
  proxy:
    api_base: https://api.openai.com/v1
    api_key: {secret: openai}

  models:
    mappings:
      # Apps can reference model: default instead of a provider-specific name.
      default: gpt-4o-mini
      gpt-4o: gpt-4o
      gpt-4o-mini: gpt-4o-mini
      gpt-4.1: gpt-4.1
      gpt-5: gpt-5
    allowed:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4.1
      - gpt-5
      - text-embedding-3-small
      - text-embedding-3-large
    defaults:
      llm: default
      embed: text-embedding-3-small
