apiVersion: infra/v1
kind: InfraBundle

metadata:
  name: llm-proxy-hardened
  description: >
    OpenAI-compatible proxy with retry outside the circuit breaker
    (failure_threshold 5, reset_timeout_s 30, on unavailable). Add
    standard:llm-cache in front when you want a cache hit to skip both.

spec:
  includes:
    - standard:openai
  pipeline:
    - id: retry-llm
      layer: retry
      for: [llm]
      per: destination
      params:
        max_attempts: 4
        retry_on: [transient, unavailable]
    - id: breaker-llm
      layer: circuit_breaker
      for: [llm]
      per: destination
      params:
        failure_threshold: 5
        reset_timeout_s: 30
        "on": [unavailable]
