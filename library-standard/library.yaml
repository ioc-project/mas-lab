  # Governance plugins
  - type: governance
    name: sample
    urn: mas.gov.sample
    module: mas.library.standard.plugins.governance.sample
    class: SampleGovernancePlugin
  - type: governance
    name: gov_no_undeclared_tool
    urn: mas.gov.no_undeclared_tool
    module: mas.library.standard.plugins.governance.no_undeclared_tool
    class: NoUndeclaredToolPlugin
    description: >
      BLOCK a TOOL_CALL whose name was not in this LLM call's tools list.
    shortcuts:
      - gov_no_undeclared_tool
      - no_undeclared_tool
  - type: governance
    name: gov_no_undeclared_peer
    urn: mas.gov.no_undeclared_peer
    module: mas.library.standard.plugins.governance.no_undeclared_peer
    class: NoUndeclaredPeerPlugin
    description: >
      BLOCK leftover delegate_to_* whose dest is not this agent's delegates_to.
    shortcuts:
      - gov_no_undeclared_peer
      - no_undeclared_peer
  - type: governance
    name: gov_hardening_profile
    urn: mas.gov.hardening_profile
    module: mas.library.standard.plugins.governance.hardening_profile
    class: HardeningProfilePlugin
    description: >
      Production hardening at run time: records the start-of-session hardening
      report and BLOCKs a tool call to a host outside allowed_hosts.
    shortcuts:
      - gov_hardening_profile
      - hardening_profile
  - type: governance
    name: budget
    urn: mas.gov.budget
    module: mas.library.standard.plugins.governance.budget
    class: BudgetPlugin
    description: >
      Call ceilings: TERMINATE once a run issued max_llm_calls LLM calls or
      max_tool_calls tool calls. Unset means no limit.
    shortcuts:
      - budget
  - type: governance
    name: environment
    urn: mas.gov.environment
    module: mas.library.standard.plugins.governance.environment
    class: EnvironmentPlugin
    description: >
      Observer for lab environment triggers. Always ALLOW. Fires world
      actions at the governance synchronous point when a port is bound.
    attributes:
      expose_as_system_tool: false
  - type: governance
    name: gdb
    urn: mas.gov.gdb
    module: mas.library.standard.plugins.governance.debug_script
    class: DebugScriptPlugin
    description: >
      gdb-like debugger. Breakpoints on tool-call and tool-result run commands
      (checkpoint, info, pause, resume) through the ControlContract. It never
      blocks. Name it in a Control spec.governance with script or script_file.
    attributes:
      expose_as_system_tool: false
      path_params: [script_file]
  - type: governance
    name: backtrack_on_error
    urn: mas.gov.backtrack_on_error
    module: mas.library.standard.plugins.governance.backtrack_on_error
    class: BacktrackOnErrorPlugin
  - type: governance
    name: retry_on_error
    urn: mas.gov.retry_on_error
    module: mas.library.standard.plugins.governance.retry_on_error
    class: RetryOnErrorPlugin
    description: >
      Ingress classifier: map failure_class through error_policy to
      allow/retry/block/skip. Egress always PASSes. Kernel applies the
      decision; this plugin owns the policy table.
    shortcuts:
      - retry_on_error
  - type: layer
    name: circuit_breaker
    urn: mas.circuit_breaker.threshold
    module: mas.library.standard.plugins.layers.circuit_breaker
    class: CircuitBreakerLayer
    description: >
      Fail-fast after consecutive matching failures on a call. Per target.
    shortcuts:
      - circuit_breaker
      - threshold
    attributes:
      per: destination
      call_kinds: [llm, tool]
      priority: 60
      control_key: circuit_breaker
      deprecated_types: [circuit_breaker]
  - type: layer
    name: health_probe
    urn: mas.layer.health_probe
    module: mas.library.standard.plugins.layers.health_probe
    class: HealthProbeLayer
    description: >
      Proactive health check: every interval, probe the tools and peers the
      spec declares probeable and take a failing one out of the running spec
      until its probe passes again.
    shortcuts:
      - health_probe
    attributes:
      per: destination
      call_kinds: [llm, tool]
      priority: 50
  - type: layer
    name: retry
    urn: mas.layer.retry
    module: mas.library.standard.plugins.layers.retry
    class: RetryLayer
    description: >
      Re-issue an llm or tool call. Defaults: LLM 4 attempts, tools 2
      (idempotent only), retry_on transient and unavailable.
    shortcuts:
      - retry
    attributes:
      per: destination
      call_kinds: [llm, tool]
      priority: 80
      control_key: retry
      retry_overlay: true
      default_steps:
        - id: retry-llm
          for: [llm]
          per: destination
          params:
            max_attempts: 4
            backoff_s: 0.5
            backoff_multiplier: 2.0
            jitter: true
            retry_on: [transient, unavailable]
        - id: retry-tool
          for: [tool]
          per: all
          params:
            max_attempts: 2
            backoff_s: 0.5
            backoff_multiplier: 2.0
            jitter: true
            retry_on: [transient, unavailable]
            require_idempotent: true
  - type: layer
    name: structured
    urn: mas.layer.structured
    module: mas.library.standard.plugins.layers.structured
    class: StructuredLayer
    shortcuts:
      - structured
    attributes:
      per: destination
      call_kinds: [llm]
      priority: 40
