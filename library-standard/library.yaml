# MAS Library Standard — manifest bundles and tool executors.
# See docs/schemas/library.schema.yaml for the full schema.

apiVersion: mas/v1
kind: Library

name: standard
description: >
  Standard library for MAS — infra bundles (OpenAI, production),
  tutorial tools (web-search, calculator), and design-pattern aliases.
version: "0.0.1"
dependencies:
  - ddgs>=9.14.0

module_base: mas.library.standard

types:
  - observability
  - design_pattern
  - context_manager
  - summarizer
  - assembler
  - memory
  - governance
  - tool_provider
  - llm_provider
  - agent_comm
  - layer
  - stack_layer
  - system_plugin
  - hitl_contract
  - user_io_contract
  - engine_tool_provider
  - related_state
  - execute_sandbox
  - circuit_breaker
  - infra_middleware
  - hitl_responder
  - control_protocol
  - checkpoint_store
  - runtime

plugins:
  - type: engine_tool_provider
    name: delegation
    urn: mas.engine_tool_provider.delegation
    module: mas.library.standard.plugins.system_tools.send
    class: SendTool
  - type: engine_tool_provider
    name: spawn_subagent
    urn: mas.engine_tool_provider.spawn_subagent
    module: mas.library.standard.plugins.engine_tools.subagent_spawner
    class: SubagentSpawner

  - type: system_plugin
    name: send
    urn: mas.system_plugin.send
    module: mas.library.standard.plugins.system_tools.send
    class: SendPlugin
    attributes: {default_enabled: false, semantic: agent_comm.send, capability: delegation}
  - type: system_plugin
    name: request_human_input
    urn: mas.system_plugin.request_human_input
    module: mas.library.standard.plugins.system_tools.request_human_input
    class: RequestHumanInputPlugin
    attributes: {default_enabled: false, communication: hitl}
  - type: system_plugin
    name: inform_user
    urn: mas.system_plugin.inform_user
    module: mas.library.standard.plugins.system_tools.inform_user
    class: InformUserPlugin
    attributes: {default_enabled: false, communication: user_io}
  - type: system_plugin
    name: pause_session
    urn: mas.system_plugin.pause_session
    module: mas.library.standard.plugins.system_tools.control
    class: PauseSessionPlugin
    attributes: {default_enabled: false, capability: control}
  - type: system_plugin
    name: subagents
    urn: mas.system_plugin.subagents
    module: mas.library.standard.plugins.system_tools.spawn_subagent
    class: SubagentsPlugin
    shortcuts:
      - subagents
      - create_subagent
    attributes: {default_enabled: false, capability: orchestration, deprecated_names: [spawn_subagent]}

  # Wire protocols (routed by spec.models[].kind / infra spec.protocol)
  - type: llm_provider
    name: openai
    urn: mas.llm_provider.openai
    module: mas.library.standard.plugins.llm.openai
    class: OpenAILLMProvider
    shortcuts:
      - openai
  # Decorator around a routed protocol plugin — not claimed as spec.models[].kind
  - type: llm_provider
    name: cache
    urn: mas.llm_provider.cache
    module: mas.library.standard.plugins.llm.cache
    class: CacheLLMProvider
    shortcuts:
      - cache
      - llm_cache

  # Default in-process Python spec.tools (used when spec.providers is omitted)
  - type: tool_provider
    name: local
    urn: mas.tool_provider.local
    module: mas.library.standard.plugins.tools.local
    class: LocalToolProvider
    shortcuts:
      - local
      - in-process
  - type: agent_comm
    name: local
    urn: mas.agent_comm.local
    module: mas.library.standard.plugins.agentcomm.local
    class: LocalAgentComm
    shortcuts:
      - local
      - agent-local
  - type: agent_comm
    name: local-group
    urn: mas.agent_comm.local_group
    module: mas.library.standard.plugins.agentcomm.local_group
    class: LocalGroupAgentComm
    shortcuts:
      - local-group
      - local_group
    attributes:
      default_enabled: false
      semantic: agent_comm
  - type: agent_comm
    name: stack
    urn: mas.agent_comm.stack
    module: mas.library.standard.plugins.agentcomm.stack
    class: StackAgentComm
    shortcuts:
      - stack
    attributes:
      default_enabled: false
      semantic: agent_comm
  - type: agent_comm
    name: trace_context
    urn: mas.agent_comm.trace_context
    module: mas.library.standard.plugins.agentcomm.trace_context
    class: TraceContextLayer
    shortcuts:
      - trace_context
      - trace-context
    attributes:
      default_enabled: false
      semantic: agent_comm
  - type: control_protocol
    name: rpc
    urn: mas.control_protocol.rpc
    module: mas.library.standard.plugins.control.rpc
    class: ControlRpcProtocol
    shortcuts:
      - rpc
      - control_rpc
  - type: checkpoint_store
    name: memory
    urn: mas.checkpoint_store.memory
    module: mas.library.standard.plugins.checkpoint
    class: InMemoryCheckpointStore
    shortcuts:
      - memory
      - in_memory
  - type: checkpoint_store
    name: disk
    urn: mas.checkpoint_store.disk
    module: mas.library.standard.plugins.checkpoint
    class: JsonCheckpointStore
    shortcuts:
      - disk
      - json
  - type: checkpoint_store
    name: hybrid
    urn: mas.checkpoint_store.hybrid
    module: mas.library.standard.plugins.checkpoint
    class: HybridCheckpointStore
    shortcuts:
      - hybrid

  # Observability plugins
  - type: observability
    name: native
    urn: mas.observability.native
    module: mas.library.standard.plugins.observability.native_plugin
    class: NativeObservabilityPlugin
    attributes:
      run_path_params: [path]
  # mas.observability.otel is registered by library-telemetry/.

  # Deterministic design patterns (OSS only)
  - type: design_pattern
    name: deterministic_single
    urn: mas.dp.deterministic_single
    module: mas.library.standard.plugins.design_patterns.single
    class: DeterministicSingleAgentPlugin
  - type: design_pattern
    name: deterministic_linear
    urn: mas.dp.deterministic_linear
    module: mas.library.standard.plugins.design_patterns.linear
    class: DeterministicLinearPlugin
  - type: design_pattern
    name: deterministic_parallel
    urn: mas.dp.deterministic_parallel
    module: mas.library.standard.plugins.design_patterns.parallel
    class: DeterministicParallelPlugin
  - type: design_pattern
    name: state_machine
    urn: mas.dp.state_machine
    module: mas.library.standard.plugins.design_patterns.state_machine
    class: StateMachinePlugin
  - type: design_pattern
    name: moderated_rounds
    urn: mas.dp.moderated_rounds
    module: mas.library.standard.plugins.design_patterns.moderated_rounds
    class: ModeratedRoundsPlugin

  # Other OSS design patterns
  - type: design_pattern
    name: react
    urn: mas.dp.react
    module: mas.library.standard.plugins.design_patterns.react
    class: ReactPlugin
  - type: design_pattern
    name: cot
    urn: mas.dp.cot
    module: mas.library.standard.plugins.design_patterns.cot
    class: CotPlugin
  - type: design_pattern
    name: single_pass
    urn: mas.dp.single_pass
    module: mas.library.standard.plugins.design_patterns.single_pass
    class: SinglePassPlugin
  - type: design_pattern
    name: introspection
    urn: mas.dp.introspection
    module: mas.library.standard.plugins.design_patterns.introspection
    class: IntrospectionPlugin
  - type: design_pattern
    name: plan_execute
    urn: mas.dp.plan_execute
    module: mas.library.standard.plugins.design_patterns.plan_execute
    class: PlanExecutePlugin
  - type: design_pattern
    name: tree_of_thoughts
    urn: mas.dp.tree_of_thoughts
    module: mas.library.standard.plugins.design_patterns.tree_of_thoughts
    class: TreeOfThoughtsPlugin

  # Context managers
  - type: context_manager
    name: stack
    urn: mas.cm.stack
    module: mas.library.standard.plugins.context.conversation
    class: StackConversation
  - type: context_manager
    name: sliding_window
    urn: mas.cm.sliding_window
    module: mas.library.standard.plugins.context.conversation
    class: SlidingWindowConversation
  - type: context_manager
    name: summarising
    urn: mas.cm.summarising
    module: mas.library.standard.plugins.context.conversation
    class: SummarizingConversation

  # Summarizer sub-plugins (composed by summarising context manager)
  - type: summarizer
    name: llm
    urn: mas.summarizer.llm
    module: mas.library.standard.plugins.context.summarizer
    class: LlmSummarizer
    shortcuts:
      - llm
  - type: summarizer
    name: drop
    urn: mas.summarizer.drop
    module: mas.library.standard.plugins.context.summarizer
    class: DropSummarizer
    shortcuts:
      - drop

  # Prompt assembler (spec.assembler)
  - type: assembler
    name: assembler
    urn: mas.ctx.assembler
    module: mas.library.standard.plugins.context.assembler
    class: ContextAssemblerPlugin
    shortcuts:
      - assembler

  # Memory plugins
  - type: memory
    name: semantic
    urn: mas.mem.semantic
    module: mas.library.standard.plugins.memory.memory_semantic
    class: SemanticMemoryPlugin

  # Governance plugins
  - type: governance
    name: sample
    urn: mas.gov.sample
    module: mas.library.standard.plugins.governance.sample
    class: SampleGovernancePlugin
  - type: governance
    name: gov_no_undeclared_tool
    urn: mas.gov.no_undeclared_tool
    module: mas.library.standard.plugins.governance.no_undeclared_tool
    class: NoUndeclaredToolPlugin
    description: >
      BLOCK a TOOL_CALL whose name was not in this LLM call's tools list.
    shortcuts:
      - gov_no_undeclared_tool
      - no_undeclared_tool
  - type: governance
    name: gov_no_undeclared_peer
    urn: mas.gov.no_undeclared_peer
    module: mas.library.standard.plugins.governance.no_undeclared_peer
    class: NoUndeclaredPeerPlugin
    description: >
      BLOCK leftover delegate_to_* whose dest is not this agent's delegates_to.
    shortcuts:
      - gov_no_undeclared_peer
      - no_undeclared_peer
  - type: governance
    name: budget
    urn: mas.gov.budget
    module: mas.library.standard.plugins.governance.budget
    class: BudgetPlugin
    description: >
      Call ceilings: TERMINATE once a run issued max_llm_calls LLM calls or
      max_tool_calls tool calls. Unset means no limit.
    shortcuts:
      - budget
  - type: governance
    name: gdb
    urn: mas.gov.gdb
    module: mas.library.standard.plugins.governance.debug_script
    class: DebugScriptPlugin
    description: >
      gdb-like debugger. Breakpoints on tool-call and tool-result run commands
      (checkpoint, info, pause, resume) through the ControlContract. It never
      blocks. Name it in a Control spec.governance with script or script_file.
    attributes:
      expose_as_system_tool: false
      path_params: [script_file]
  - type: governance
    name: backtrack_on_error
    urn: mas.gov.backtrack_on_error
    module: mas.library.standard.plugins.governance.backtrack_on_error
    class: BacktrackOnErrorPlugin
  - type: governance
    name: retry_on_error
    urn: mas.gov.retry_on_error
    module: mas.library.standard.plugins.governance.retry_on_error
    class: RetryOnErrorPlugin
    description: >
      Ingress classifier: map failure_class through error_policy to
      allow/retry/block/skip. Egress always PASSes. Kernel applies the
      decision; this plugin owns the policy table.
    shortcuts:
      - retry_on_error
  - type: layer
    name: circuit_breaker
    urn: mas.circuit_breaker.threshold
    module: mas.library.standard.plugins.layers.circuit_breaker
    class: CircuitBreakerLayer
    description: >
      Fail-fast after consecutive matching failures on a call. Per target.
    shortcuts:
      - circuit_breaker
      - threshold
    attributes:
      per: destination
      call_kinds: [llm, tool]
      priority: 60
      deprecated_types: [circuit_breaker]
  - type: layer
    name: retry
    urn: mas.layer.retry
    module: mas.library.standard.plugins.layers.retry
    class: RetryLayer
    description: >
      Re-issue an llm or tool call. Defaults: LLM 4 attempts, tools 2
      (idempotent only), retry_on transient and unavailable.
    shortcuts:
      - retry
    attributes:
      per: destination
      call_kinds: [llm, tool]
      priority: 80
  - type: hitl_contract
    name: registry
    urn: mas.hitl_contract.registry
    module: mas.library.standard.plugins.hitl.contracts
    class: RegistryHitlContract
  - type: hitl_contract
    name: auto_resolve
    urn: mas.hitl_contract.auto_resolve
    module: mas.library.standard.plugins.hitl.contracts
    class: AutoResolveHitlContract
    shortcuts:
      - auto
      - auto_resolve
  - type: user_io_contract
    name: registry
    urn: mas.user_io_contract.registry
    module: mas.library.standard.plugins.hitl.contracts
    class: RegistryUserIOContract
  - type: related_state
    name: git_worktree
    urn: mas.related_state.git_worktree
    module: mas.library.standard.plugins.related_state.git_worktree
    class: GitWorktreeRelatedState
  - type: related_state
    name: copy_dir
    urn: mas.related_state.copy_dir
    module: mas.library.standard.plugins.related_state.copy_dir
    class: CopyDirRelatedState
  - type: execute_sandbox
    name: workdir
    urn: mas.execute_sandbox.workdir
    module: mas.library.standard.plugins.sandbox.workdir
    class: WorkdirSandbox
    shortcuts:
      - workdir
      - git_worktree
  - type: layer
    name: llm_cache
    urn: mas.infra_middleware.llm_cache
    module: mas.library.standard.plugins.infra.llm_cache
    class: LlmCacheMiddleware
    shortcuts:
      - llm_cache
      - llm-cache
    attributes:
      per: all
      call_kinds: [llm]
      priority: 100
      stores_llm_responses: true
      deprecated_types: [infra_middleware]
  - type: layer
    name: llm_scheduler
    urn: mas.infra_middleware.llm_scheduler
    module: mas.library.standard.plugins.infra.llm_scheduler
    class: LlmSchedulerMiddleware
    shortcuts:
      - llm_scheduler
    attributes:
      per: destination
      call_kinds: [llm]
      priority: 40
      paces_llm_calls: true
      deprecated_types: [infra_middleware]
  - type: layer
    name: fault_inject
    urn: mas.infra_middleware.fault_inject
    module: mas.library.standard.plugins.infra.fault_inject
    class: FaultInjectMiddleware
    shortcuts:
      - fault_inject
    attributes:
      per: destination
      call_kinds: [llm]
      priority: 20
      deprecated_types: [infra_middleware]
  - type: layer
    name: delay
    urn: mas.layer.delay
    module: mas.library.standard.plugins.stack.impair
    class: DelayLayer
    shortcuts:
      - delay
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
      deprecated_types: [stack_layer]
  - type: layer
    name: drop
    urn: mas.layer.drop
    module: mas.library.standard.plugins.stack.impair
    class: DropLayer
    shortcuts:
      - drop
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
      deprecated_types: [stack_layer]
  - type: layer
    name: fail
    urn: mas.layer.fail
    module: mas.library.standard.plugins.stack.impair
    class: FailLayer
    shortcuts:
      - fail
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
      deprecated_types: [stack_layer]
  - type: layer
    name: corrupt
    urn: mas.layer.corrupt
    module: mas.library.standard.plugins.stack.impair
    class: CorruptLayer
    shortcuts:
      - corrupt
    attributes:
      per: destination
      call_kinds: [send]
      priority: 10
      deprecated_types: [stack_layer]
  - type: layer
    name: replay
    urn: mas.layer.replay
    module: mas.library.standard.plugins.stack.impair
    class: ReplayLayer
    shortcuts:
      - replay
    attributes:
      per: destination
      call_kinds: [send]
      priority: 10
      deprecated_types: [stack_layer]
  - type: hitl_responder
    name: auto_approve
    urn: mas.hitl_responder.auto_approve
    module: mas.library.standard.plugins.hitl.responders
    class: AutoApproveResponder
    shortcuts:
      - auto-approve
      - auto_approve
  - type: hitl_responder
    name: auto_deny
    urn: mas.hitl_responder.auto_deny
    module: mas.library.standard.plugins.hitl.responders
    class: AutoDenyResponder
    shortcuts:
      - auto-deny
      - auto_deny

defaults:
  tool_provider: local
  summarizer: llm
  llm_provider: openai
  agent_comm: local
  hitl_contract: registry
  user_io_contract: registry
