    urn: mas.related_state.copy_dir
    module: mas.library.standard.plugins.related_state.copy_dir
    class: CopyDirRelatedState
  - type: execute_sandbox
    name: workdir
    urn: mas.execute_sandbox.workdir
    module: mas.library.standard.plugins.sandbox.workdir
    class: WorkdirSandbox
    shortcuts:
      - workdir
      - git_worktree
  - type: layer
    name: llm_cache
    urn: mas.infra_middleware.llm_cache
    module: mas.library.standard.plugins.infra.llm_cache
    class: LlmCacheMiddleware
    shortcuts:
      - llm_cache
      - llm-cache
    attributes:
      per: all
      call_kinds: [llm]
      priority: 100
      stores_llm_responses: true
      deprecated_types: [infra_middleware]
  - type: layer
    name: llm_scheduler
    urn: mas.infra_middleware.llm_scheduler
    module: mas.library.standard.plugins.infra.llm_scheduler
    class: LlmSchedulerMiddleware
    shortcuts:
      - llm_scheduler
    attributes:
      per: destination
      call_kinds: [llm]
      priority: 40
      paces_llm_calls: true
      deprecated_types: [infra_middleware]
  - type: layer
    name: fault_inject
    urn: mas.infra_middleware.fault_inject
    module: mas.library.standard.plugins.infra.fault_inject
    class: FaultInjectMiddleware
    shortcuts:
      - fault_inject
    attributes:
      per: destination
      call_kinds: [llm]
      priority: 20
      deprecated_types: [infra_middleware]
  - type: layer
    name: delay
    urn: mas.layer.delay
    module: mas.library.standard.plugins.stack.impair
    class: DelayLayer
    shortcuts:
      - delay
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
  - type: layer
    name: drop
    urn: mas.layer.drop
    module: mas.library.standard.plugins.stack.impair
    class: DropLayer
    shortcuts:
      - drop
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
  - type: layer
    name: fail
    urn: mas.layer.fail
    module: mas.library.standard.plugins.stack.impair
    class: FailLayer
    shortcuts:
      - fail
    attributes:
      per: destination
      call_kinds: [send, llm, tool]
      priority: 10
  - type: layer
    name: corrupt
    urn: mas.layer.corrupt
    module: mas.library.standard.plugins.stack.impair
    class: CorruptLayer
    shortcuts:
      - corrupt
    attributes:
      per: destination
      call_kinds: [send]
      priority: 10
  - type: layer
    name: replay
    urn: mas.layer.replay
    module: mas.library.standard.plugins.stack.impair
    class: ReplayLayer
    shortcuts:
      - replay
    attributes:
      per: destination
      call_kinds: [send]
      priority: 10
  - type: hitl_responder
    name: auto_approve
    urn: mas.hitl_responder.auto_approve
    module: mas.library.standard.plugins.hitl.responders
    class: AutoApproveResponder
    shortcuts:
      - auto-approve
      - auto_approve
  - type: hitl_responder
    name: auto_deny
    urn: mas.hitl_responder.auto_deny
    module: mas.library.standard.plugins.hitl.responders
    class: AutoDenyResponder
    shortcuts:
      - auto-deny
      - auto_deny
  - type: agent_loop
    name: stdio-harness
    urn: mas.agent_loop.stdio-harness
    module: mas.library.standard.plugins.loop.stdio_harness
    class: StdioHarnessLoop
    description: >
      Drive an external harness over stdin and stdout: an allow-listed absolute command, no shell,
      explicit environment, deadlines and size caps, line or JSON-RPC framing.
    shortcuts:
      - stdio-harness
  - type: secret_store
    name: file
    urn: mas.secret_store.file
    module: mas.library.standard.plugins.secrets.file_store
    class: FileSecretStore
    shortcuts:
      - file
  - type: secret_store
    name: env
    urn: mas.secret_store.env
    module: mas.library.standard.plugins.secrets.env_store
    class: EnvSecretStore
    shortcuts:
      - env
  - type: identity_scheme
    name: none
    urn: mas.identity_scheme.none
    module: mas.library.standard.plugins.identity.none
    class: NoIdentity
    description: The explicit "no identity" scheme; presents nothing, verifies everyone as anonymous.
  - type: identity_scheme
    name: signed_badge
    urn: mas.identity_scheme.signed_badge
    module: mas.library.standard.testing.identity_signed_badge
    class: SignedBadge
    description: >
      Reference double for tests and tutorials, not a production scheme. The holder presents claims and an HMAC in one
      header, the verifier checks them offline; the claims are its public facts.
  - type: layer
    name: identity
    urn: mas.layer.identity
    module: mas.library.standard.plugins.identity.layer
    class: IdentityLayer
    description: >
      Presents an identity on the way down and verifies one on the way up, over any scheme. Below the MCP or LLM
      protocol layer on an HTTP call; above the protocol layer on an agent link.
    shortcuts:
      - identity
    attributes:
      protocol_layer: true
      per: destination
      call_kinds: [llm, tool]
      priority: 10
  - type: governance
    name: identity_gate
    urn: mas.gov.identity_gate
    module: mas.library.standard.plugins.identity.gate
    class: IdentityGate
    description: >
      Advisory identity gate: BLOCK a tool call whose agent identity does not cover the tool's requirement
      (no_identity, credential_revoked, scope_uncovered, gate_stale), from the public view of the identity, in the
      one requirement grammar.
    shortcuts:
      - identity-gate
      - identity_gate
    attributes:
      identity_gate: true
  - type: governance
    name: identity_guard
    urn: mas.gov.identity_guard
    module: mas.library.standard.plugins.identity.guard
    class: IdentityGuard
    description: >
      Shuts the wallet's own tools (identity_delegate, identity_revoke) by default: BLOCK unless a policy allows the
      tool or holds it for a human.
    shortcuts:
      - identity-guard
      - identity_guard
    attributes:
      identity_guard: true

defaults:
  tool_provider: local
  summarizer: llm
  llm_provider: openai
  agent_comm: local
  hitl_contract: registry
  user_io_contract: registry
  secret_store: file
