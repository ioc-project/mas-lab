site_name: MAS-Lab
site_description: >-
  Multi-Agent System Lab — experimentation, benchmarking, and analysis for
  reliable multi-agent systems.
site_url: https://outshift-open.github.io/mas-lab/
repo_url: https://github.com/outshift-open/mas-lab
repo_name: GitHub
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/mas-lab-logo.svg
  favicon: assets/mas-lab-icon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/mas-lab.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/outshift-open/mas-lab

plugins:
  - search
  - material/blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      authors_file: "{blog}/.authors.yml"
      archive_name: Archive
      categories_name: Categories
      categories_allowed:
        - Updates
        - Releases

exclude_docs: |
  doc-map.md
  blog/README.md
  REVIEW-2026-06-29.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - MAS-Lab:
      - MAS-Lab: index.md
      - Overview: overview.md
  - User guide:
      - user-guide.md
      - Labs vs libraries: labs-and-libraries.md
      - user-config.md
      - "config.yaml": references/config.yaml.md
      - libraries.md
      - CLI:
          - Overview: cli/index.md
          - mas-lab index: cli/mas-lab.md
          - mas-ctl: cli/mas-ctl.md
          - Observability / run logs: cli/observability.md
          - compile: cli/compile.md
      - Web UI: ui/index.md
      - Live dashboard: ui/live.md
      - ctl/tui.md
      - glossary.md
  - Tutorials:
      - tutorials/index.md
      - "0 — Environment setup": tutorials/00-environment-setup/README.md
      - "1 — Build an agent": tutorials/01-building-an-agent/README.md
      - "2 — Orchestrate your MAS": tutorials/02-creating-a-mas/README.md
      - "3 — Run an experiment": tutorials/03-experiments-and-analysis/README.md
      - "4 — MCP tools": tutorials/04-mcp-tools/README.md
      - "5 — A2A agents": tutorials/05-a2a-agents/README.md
      - "6 — Agent skills": tutorials/06-agent-skills/README.md
      - "8 — Telemetry": tutorials/08-telemetry/README.md
      - "9 — KG & OXP": tutorials/09-kg-oxp/README.md
      - "10 — Evaluation metrics": tutorials/10-evaluation-metrics/README.md
      - "11 — Sessions and recovery": tutorials/11-sessions-and-recovery/README.md
      - "12 — Spawned subagents": tutorials/12-subagents/README.md
      - "13 — Control attach and debug scripts": tutorials/13-control-and-debug/README.md
      - "14 — Governance and HITL": tutorials/14-governance-hitl/README.md
  - References:
      - Overview: references/index.md
      - "ADR 0001 — lab terminology": references/adr-0001-lab-terminology.md
      - Specifications:
          - Agent:
              - Overview: manifests/agent.md
              - Governance: manifests/governance.md
              - Session checkpoints: manifests/checkpoint.md
              - Subagents: manifests/subagents.md
          - System tools: manifests/system-tools.md
          - Plugin bindings: manifests/plugin-bindings.md
          - Context assembly: manifests/context-assembly.md
          - Summarization: manifests/summarization.md
          - "Compiled agent defaults": references/defaults.md
          - MAS: manifests/mas.md
          - Topology & workflow: manifests/topology-and-workflow.md
          - Workflow: manifests/workflow.md
          - Overlay: manifests/overlay.md
          - Flavour: manifests/flavour.md
          - Infra: manifests/infra.md
          - RuntimeEngine: manifests/runtime-engine.md
          - "LLM cache (guide)": manifests/llm-cache.md
          - "LLM reasoning / thinking": manifests/llm-reasoning.md
          - "LLM model catalog": manifests/llm-model-catalog.md
          - "config.yaml": references/config.yaml.md
          - Schemas: references/schemas.md
      - Runtime:
          - Manifest fields: manifests/runtime.md
          - Context management: references/context-management.md
          - Reliability: references/reliability.md
          - "LLM cache (reference)": references/llm-cache.md
          - Contracts: references/contracts.md
          - Snapshots vs checkpoints: references/snapshots.md
          - Kernel operations: references/kernel-primitives.md
          - Thin waist: references/thin-waist.md
          - System tools: references/system-tools.md
          - Package documentation: references/runtime.md
      - Lab & benchmarks:
          - Experiment: manifests/experiment.md
          - Dataset: manifests/dataset.md
          - Pipeline: manifests/pipeline.md
          - Lab folder: manifests/lab.md
          - Library discovery: library-discovery.md
          - Package documentation: references/lab.md
  - Paper: paper/index.md
  - Blog:
      - All posts: blog/index.md
