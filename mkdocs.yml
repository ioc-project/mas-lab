site_name: MAS-Lab
site_description: >-
  Multi-Agent System Lab — experimentation, benchmarking, and analysis for
  reliable multi-agent systems. Part of the Internet of Cognition.
site_url: https://ioc-project.github.io/mas-lab/
repo_url: https://github.com/ioc-project/mas-lab
repo_name: ioc-project/mas-lab
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/outshift-logo.svg
  favicon: assets/mas-lab-icon.svg
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/ioc.css
  - stylesheets/ioc-layout.css

extra:
  generator: false
  homepage: https://ioc-project.github.io/
  ioc_home: https://ioc-project.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ioc-project/mas-lab

hooks:
  - scripts/mkdocs_github_stats.py

plugins:
  - search
  - material/blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      authors_file: "{blog}/.authors.yml"
      archive_name: Archive
      categories_name: Categories
      categories_allowed:
        - Updates
        - Releases

exclude_docs: |
  doc-map.md
  blog/README.md
  REVIEW-2026-06-29.md
  design/IMPLEMENTATION-SUMMARY.md
  design/agent-driven-hitl-impl-plan.md
  includes/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

