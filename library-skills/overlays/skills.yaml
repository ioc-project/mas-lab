# Skills overlay — explicit opt-in for activate_skill as a system plugin.
# Listing spec.skills already injects this implicitly; use this overlay when
# you want the plugin declared in the manifest.
#
# Usage:
#   mas-ctl chat agents/my-agent.yaml \
#     -o pkg://skills/overlays/skills.yaml

apiVersion: mas/v1
kind: Overlay
metadata:
  name: skills
spec:
  target:
    kind: Agent
  patch:
    system_plugins:
      $op:
        add:
          - activate_skill
