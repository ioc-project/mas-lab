apiVersion: infra/v1
kind: ToolServerRegistry
metadata: {name: records}
spec:
  tool_servers:
    - id: records
      protocol: mcp
      transport: streamable-http
      url: http://127.0.0.1:9200/mcp
      tools: [records_read, records_write]
