name: tutorial-15-world-events
title: "Tutorial 15 — World events and fixtures"
description: >
  Validate the offline environment example that revokes a credential after
  the second tool result.
version: "1.0"
authors: ["MAS Framework Team"]
tags: ["environment", "fixtures", "tutorial"]
prerequisites:
  - "Tutorial 3"
estimated_duration_min: 10
working_dir: .
cache_dir: ".demo-cache"

sections:
  - id: validate
    title: "Validate"
    steps:
      - type: command
        title: "Validate the revocation experiment"
        command: mas-lab validate labs/revocation.lab/experiment.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"
