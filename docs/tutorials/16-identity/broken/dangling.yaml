# A tool server whose identity step names a record no Identity row declares.
apiVersion: infra/v1
kind: ToolServerRegistry
metadata: {name: fare-tools-dangling}
spec:
  tool_servers:
    - id: fares
      protocol: mcp
      usage: connect
      transport: streamable-http
      url: http://127.0.0.1:9101/mcp
      tools: "*"
      pipeline:
        - {layer: identity, params: {identity: no-such-badge}}
