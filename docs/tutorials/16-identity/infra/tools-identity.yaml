# Step 2: the same server, now with the identity layer on its row. The layer sits between the HTTP transport and MCP,
# presents the record it names, and the rest of the row is as it was.
apiVersion: infra/v1
kind: ToolServerRegistry
metadata: {name: fare-tools-identity}
spec:
  tool_servers:
    - id: fares
      protocol: mcp
      usage: connect
      transport: streamable-http
      url: http://127.0.0.1:9101/mcp
      tools: "*"
      pipeline:
        - layer: identity
          params:
            identity: desk-badge
            audience: {protocol: mcp, target: fares}
