mas_ctl:
  flavour: local
  # non-secret MAS_LLM_* only; API keys: mas-ctl secrets set
  env: .env
  # Human exchange log on stderr. Machines use events.jsonl / telemetry.
  trace: summary

mas_lab:
  flavour: local
  benchmark_flavour: local

# OpenAI via library-standard (`echo KEY | mas-ctl secrets set openai`)
infra_refs:
  - standard:openai
