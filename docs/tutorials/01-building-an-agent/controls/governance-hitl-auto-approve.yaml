# Same HITL gates as governance-hitl.yaml, answered by an explicit auto-approve:
# a run with no operator (-q, CI) refuses a hold unless the spec says this.
apiVersion: control/v1
kind: Control
metadata:
  name: governance-hitl-auto-approve
spec:
  governance:
  - sample_governance:
      hitl_on_tool: true
      hitl_on_tool_result: true
      hitl_once_per_turn: false
      hitl_mode: auto-approve
