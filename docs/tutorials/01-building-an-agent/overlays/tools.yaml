# Overlay: add web-search + calculator tools.
# No prompt text is needed: each tool's name, description and parameters are sent to the model.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: tools
spec:
  target:
    kind: Agent
  patch:
    tools:
      $op:
        add:
          - ref: samples:tools/web-search.tool.yaml
          - ref: samples:tools/calc.tool.yaml
          - kind: system
            name: request_human_input
          - kind: system
            name: inform_user
