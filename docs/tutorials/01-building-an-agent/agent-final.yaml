# agent-final.yaml — READ-ONLY reference
#
# Hand-written reading aid: roughly what the runtime sees after merging the
# tools, skills and memory overlays of Tutorial 1 (run `mas-ctl compile` for the
# exact, fully expanded result):
#
#   mas-ctl chat agent.yaml -i \
#     -o overlays/tools.yaml   \
#     -o overlays/skills.yaml  \
#     -o overlays/memory.yaml
#
# DO NOT run this file directly — it exists only so you can visualise
# the fully-assembled agent in one place.  The real workflow is:
#   base (agent.yaml) + overlays stacked with -o / --overlay.
#
apiVersion: mas/v1
kind: Agent

metadata:
  name: qa-agent
  description: "Tutorial 1 — Q&A agent"

spec:
  description: Answer general knowledge questions.

  # ── Model (from agent.yaml) ─────────────────────────────────────────────
  models:
    - model: gpt-4o

  # ── Context (merged from agent.yaml + skills overlay + memory overlay) ─
  context:
    intent: "Answer general knowledge questions."
    role: |
      Answer questions clearly and concisely.
    memory_usage: |
      IMPORTANT — You have a long-term memory. Relevant memories are shown in context.
      When the user corrects you or shares a preference, store it with memory_store.

  # ── Skills (from skills overlay) ──────────────────────────────────────────
  skills:
    - answer-formatting

  # ── Tools (from tools overlay + memory overlay) ───────────────────────────
  # memory-search provider exposes: memory_search, memory_get, memory_store
  tools:
    - ref: samples:tools/web-search.tool.yaml
    - ref: samples:tools/calc.tool.yaml
    - kind: system
      name: request_human_input
    - kind: system
      name: inform_user
    - ref: samples:tools/memory-search.tool.yaml

  # ── Memory (from memory overlay) ─── ephemeral (in-memory, no filesystem)
  memory: semantic
