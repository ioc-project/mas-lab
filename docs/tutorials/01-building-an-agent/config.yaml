# Live workspace. mas-ctl chat uses Tutorial 0 default_infra
# (or MAS_INFRA_REFS / --infra-ref).
# Offline CI: pair standard:openai with tests/fixtures/llm-cache/ci-replay.yaml.
mas_ctl:
  flavour: local
  # non-secret MAS_LLM_* only; API keys: mas-ctl secrets set
  env: .env
  # Human exchange log on stderr. Machines use events.jsonl / telemetry.
  trace: summary
