# Tutorial 13 Control: backtrack after a repeated tool error.
apiVersion: control/v1
kind: Control
metadata:
  name: t13-auto-recover
spec:
  agents: $all
  governance:
  - sample_governance:
      error_recovery_plugin: backtrack_on_error
      backtrack:
        repeat_threshold: 2
        max_backtracks_per_session: 3
        steps: 1
        on_cap_reached: stop_backtracking
