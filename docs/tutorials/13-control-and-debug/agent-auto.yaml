# Tutorial 13 auto-checkpoint agent: every_turn + tool-error backtrack (flavour-auto.yaml).
apiVersion: mas/v1
kind: Agent

metadata:
  name: debug-script-auto

spec:
  models:
    - model: gpt-4o-mini
  description: "Flaky calc tool, with automatic checkpoints and error backtrack."
  context:
    role: |
      You are a research assistant. Use calc for arithmetic.
      If a tool errors, try once more.
  tools:
    - ref: ./tools/calc-flaky.tool.yaml
  checkpoint:
    mode: every_turn
    retention:
      mode: all
