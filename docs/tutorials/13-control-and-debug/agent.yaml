# Tutorial 13 agent: control attach and checkpoints. flavour-debug.yaml attaches its gdb plugin.
apiVersion: mas/v1
kind: Agent

metadata:
  name: debug-script-demo

spec:
  models:
    - model: gpt-4o-mini
  description: "Research assistant for control attach, checkpoints, and steering."
  context:
    role: |
      You are a research assistant. Use web_search for facts and calc for arithmetic.
      Remember earlier turns in the same session.
  tools:
    - ref: ./tools/web_search.tool.yaml
    - ref: ./tools/calc.tool.yaml
