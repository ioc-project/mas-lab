apiVersion: mas/v1
kind: MAS

metadata:
  name: support-specialists
  version: "0.1.0"

intent:
  summary: >
    The specialist half of the support desk: billing and outage.

spec:
  agency:
    agents:
      - id: billing
        ref: agents/billing/agent.yaml
      - id: outage
        ref: agents/outage/agent.yaml

  workflow:
    entry: billing
    nodes:
      - id: billing
      - id: outage
