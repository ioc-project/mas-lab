# The A2A server the outage team runs (Tutorial 5): the desk dials it (connect), the outage team hosts on it (listen).
apiVersion: infra/v1
kind: Application
metadata:
  name: outage-server
spec:
  endpoints:
    outage-server: {protocol: a2a, url: "http://127.0.0.1:9003", usage: [connect, listen]}
