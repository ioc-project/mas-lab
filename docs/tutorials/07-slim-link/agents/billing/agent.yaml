apiVersion: mas/v1
kind: Agent

metadata:
  name: billing

spec:
  description: "Answer billing questions."
  context:
    role: |
      You answer billing questions: invoices, refunds, plans. Answer in two
      sentences at most. If a question is not about billing, say so.
