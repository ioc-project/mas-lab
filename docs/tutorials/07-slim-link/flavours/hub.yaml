apiVersion: flavour/v1
kind: Flavour
metadata:
  name: desk-hub
  description: Triage on the node; billing and outage dialled on the A2A hub, outage at a url of its own.
spec:
  bind:
    agent_comm: [desk-node]
    usage: [connect, listen]
    agents:
      billing:
        agent_comm: [agent-hub, desk-a2a]
        usage: connect
      outage:
        agent_comm: [agent-hub, desk-a2a]
        usage: connect
        params:
          agent-hub: {url: "https://outage.example.test/a2a"}
