apiVersion: flavour/v1
kind: Flavour
metadata:
  name: desk-mixed
  description: The desk on the node; outage is reached at its own A2A server.
spec:
  bind:
    agent_comm: [desk-node]
    usage: [connect, listen]
    agents:
      outage:
        agent_comm: [outage-server]
        usage: connect
