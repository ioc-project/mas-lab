apiVersion: flavour/v1
kind: Flavour
metadata:
  name: desk-billing-over-a2a
  description: The desk on the node; billing alone on A2A framing over its own connection to the node.
spec:
  bind:
    agent_comm: [desk-node]
    usage: [connect, listen]
    agents:
      billing:
        agent_comm: [desk-node-a2a, desk-a2a]
