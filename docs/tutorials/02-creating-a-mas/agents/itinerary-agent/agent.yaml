apiVersion: mas/v1
kind: Agent
metadata:
  name: itinerary_agent
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 1500
  design_pattern:
    type: react
  skills:
  - route-planning
  tools:
  - ref: ../../tools/query_graph_database.tool.yaml
  description: Route planner and itinerary specialist.
  context:
    role: 'You are an itinerary specialist. You have access to the query_graph_database

      tool which queries a graph of cities and returns feasible paths with their

      travel times.


      Always call this tool before describing a route. If found is false or the

      city is unknown, report that and do not invent attractions or paths.

      Present your findings clearly.'
