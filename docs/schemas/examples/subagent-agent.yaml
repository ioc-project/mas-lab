apiVersion: mas/v1
kind: Agent
metadata:
  name: bounded-reviewer
spec:
  description: Coordinates a bounded review.
  system_plugins:
    - subagents:
        templates:
          - id: reviewer
            ref: ./subagent-reviewer.yaml
            description: Review a proposed change.
        max_spawns: 8
        max_depth: 3