$schema: https://json-schema.org/draft/2020-12/schema
$id: mas-lab/schemas/plugins/comm-layer/v0.1
title: CommLayerCapabilities
description: >
  Capability flags a link plugin declares. A plugin that declares nothing is
  unknown. Unknown cannot claim isolation, e2e, reliable, or persistent_groups.
type: object
additionalProperties: false
required:
  - unicast
  - anycast
  - group
  - ordered
  - reliable
  - e2e
  - persistent_groups
  - isolation
properties:
  unicast:
    type: boolean
    description: Point-to-point send to a named instance.
  anycast:
    type: boolean
    description: Send to any instance of a three-component service name.
  group:
    type: boolean
    description: Channel create/invite/remove/publish/members/subscribe.
  ordered:
    type: boolean
    description: Per-sender FIFO on a channel.
  reliable:
    type: boolean
    description: Acked delivery (or an equivalent guarantee).
  e2e:
    type: boolean
    description: End-to-end encryption (for example MLS).
  persistent_groups:
    type: boolean
    description: Group membership survives process restart.
  isolation:
    type: boolean
    description: Namespaces or ACLs keep tenants from reaching each other.
