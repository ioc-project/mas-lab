$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#flavour"
title: "Flavour Manifest"
description: >
  Schema for kind: Flavour manifests.

  A Flavour is the glue between the logic spec and the infra: spec.bind links
  each agent to infra rows and says what this deployment does with it. It
  defines no endpoint, protocol or plugin of its own, and it does NOT own model
  names, LLM inference parameters, skills/RAG configuration, or infrastructure
  coordinates. Those concerns belong to:

    * kind: Agent  (spec.models, spec.skills)  — model choice, inference
                                                  params, RAG backend
    * kind: MAS    (spec.agency)                — topology / orchestration
    * infra/v1 RuntimeEngine (workspace runtime_refs, --runtime-ref) — cache
                                                    policy, stream, queue depth
    * infra/v1 LLMProxy / provider bundle (workspace infra_refs) — LLM endpoint,
                                                    including standard:openai
    * infra/v1     (LLMProxy, InfraBundle)       — api_base, api_key_env,
                                                    allowed models, embed
                                                    defaults

  agent_comm, tools, telemetry and observability are accepted and read by
  nothing (deprecated: true). spec.control as a list of {ref, agents} attaches
  kind: Control documents; the leftover mapping form is still accepted and
  unread. They are not what a Flavour is. Bundled local, prod, auto, and
  local-benchmark set none of those leftover keys.

  Infrastructure references (infra_refs) are NOT part of the Flavour — they
  belong in config.yaml or on the CLI (--infra-ref).  This separation
  keeps flavours portable and reusable across deployments.

  FORBIDDEN (rejected by FlavourSeparationValidator at load time): spec.llm,
  spec.skills, spec.prefer_local. These belong on kind: Agent / workspace
  infra and runtime refs — a flavour that still declares them is carrying
  model-selection or execution-mode state that doesn't belong to a deployment
  posture.

type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
additionalProperties: false
patternProperties:
  "^x-":
    description: "Extension properties (UI metadata, canvas state, etc.) — ignored by the runtime."

properties:
  apiVersion:
    type: string
    description: "API version — 'flavour/v1'."

  kind:
    type: string
    const: "Flavour"

  metadata:
    type: object
    additionalProperties: true
    properties:
      name:
        type: string
      version:
        type: string
      description:
        type: string
      tags:
        type: array
        items:
          type: string

  spec:
    type: object
    additionalProperties: true
    description: >
      Flavour specification. All sub-objects are additionalProperties: true to
      remain forward-compatible as new sections are added.

      NOTE: infra_refs / infra_ref are NOT allowed here — infrastructure
      references belong in config.yaml or on the CLI (--infra-ref). The
      separation validator rejects flavours that include them.
    properties:
      bind:
        type: object
        additionalProperties: false
        description: >
          What each interaction rides. The Flavour names infra rows; it
          defines none. Unrelated to the deprecated --bind CLI alias of
          --connect.
        properties:
          agent_comm:
            type: array
            minItems: 1
            uniqueItems: true
            description: >
              Application row names, bottom first: the layers every
              agent-to-agent call of the session rides, unless an agent has
              its own chain under agents. Each row's protocol is
              the layer plugin and its other fields are the layer's params.
            items:
              type: string
              minLength: 1
          usage:
            description: >
              This deployment's default usage for every agent that omits its
              own: connect (reach it), listen (host it), or both. Default
              connect. An agent this process serves sets listen.
            oneOf:
              - type: string
                enum: [connect, listen]
              - type: array
                items: {type: string, enum: [connect, listen]}
                minItems: 1
                uniqueItems: true
          agents:
            type: object
            description: >
              How this deployment links each agent, by agent id. agent_comm
              is the agent's own chain of rows (else the default agent_comm
              above); usage says whether this deployment reaches the agent
              there (connect), hosts it here (listen), or both. Omitted, it
              is bind.usage, else connect, and must be within the usage of
              every row of the chain; params
              overrides a row's params for this agent. A
              one-row chain whose row is an agent_comm link with a url (an
              A2A server) reaches the agent at that url, the released direct
              path. An id that is no agent of the session is refused.
            additionalProperties:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                agent_comm:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                usage:
                  oneOf:
                    - type: string
                      enum: [connect, listen]
                    - type: array
                      items: {type: string, enum: [connect, listen]}
                      minItems: 1
                      uniqueItems: true
                params:
                  type: object
                  description: >
                    Per-row overrides for this agent: row name to {param: value}.
                    A string value may hold {agent}, the only placeholder.
                  additionalProperties:
                    type: object
          events:
            type: array
            minItems: 1
            uniqueItems: true
            description: >
              Application row names of observability sinks this deployment
              uses (native JSONL, OTel). The Flavour names the rows; the
              rows themselves are infra.
            items:
              type: string
              minLength: 1
      agent_comm:
        type: object
        deprecated: true
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: >
          Deprecated and ignored: the in-process link block of the bundled
          flavours. Nothing reads it. How agents reach each other is bind.
        properties:
          protocol:
            type: string
            description: "local | grpc | hybrid"
          mode:
            type: string
            description: "local | remote"
          emulation:
            type: boolean
          agents:
            type: object
            additionalProperties:
              type: string
            description: "agent-id → socket/TCP address (grpc/hybrid protocols only)"

      capabilities:
        type: object
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: "Feature flags and capability overrides."

      telemetry:
        type: object
        deprecated: true
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: >
          Deprecated and ignored: basic telemetry / log sink configuration.
          Nothing reads it. Planned to move to an optional Control manifest.
        properties:
          backend:
            type: string
            description: "file | none"
          path:
            type: string

      observability:
        deprecated: true
        oneOf:
          - type: "null"
          - $ref: "./fragments/observability-binding.schema.yaml"
        x-merge:
          strategy: plugin_list_ops
          identity: plugin_id
        description: >
          Deprecated and ignored: leftover observability plugin list.
          Nothing reads it. Observability is a Control entry or --events*
          on the agent or MAS. bind.events names sink rows.
        default: null

      require_usage:
        type: boolean
        description: >
          When true, every agent of the session must have a bind chain or
          an agent-keyed Application row. Bundled prod sets this. A file
          named prod.yaml does not.

      control:
        description: >
          Control manifests this Flavour attaches. A list of {ref, agents}.
          agents is $all (default), $entry, $not-entry, $delegates, one agent
          id, a list of ids, or the same agent path as --override (.mas.agent[id] / .mas.agent[*]).
          The leftover mapping form (budget, retry, …) is still accepted and
          read by nothing.
        x-merge:
          strategy: mapping_ops
        oneOf:
          - type: "null"
          - type: array
            items:
              type: object
              additionalProperties: false
              required: [ref]
              properties:
                ref:
                  type: string
                  minLength: 1
                settings:
                  type: object
                  description: >
                    Settings merged over the named plugins of that Control, so one Control file can carry
                    different settings on different agents. Keys are plugin names the Control lists; values
                    are that plugin's settings.
                  additionalProperties:
                    type: object
                agents:
                  oneOf:
                    - type: string
                      minLength: 1
                      description: "$all, $entry, $not-entry, $delegates, one agent id, or the same agent path as --override"
                    - type: array
                      items:
                        type: string
                        minLength: 1
                      minItems: 1
                      uniqueItems: true
          - $ref: "./fragments/control-binding.schema.yaml"
        default: null

      tools:
        type: object
        deprecated: true
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: >
          Deprecated and ignored: tool exposure protocol and remote-tool
          policy. Nothing reads it. Tool exposure is configured through infra.
        properties:
          exposure_protocol:
            type: string
            enum: [mcp]
            description: Protocol used to expose this app's local tools.
          remote_tools_enabled:
            type: boolean
          allowed:
            type: array
            items:
              type: string

      config:
        type: object
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: >
          Free-form deployment config: infrastructure URLs, non-secret
          identifiers, feature flags.  Never place secret values here — use
          api_key_env references in infra manifests instead.

      operator:
        type: object
        x-merge:
          strategy: mapping_merge_or_ops
        additionalProperties: true
        description: "Operator / provisioner metadata."
