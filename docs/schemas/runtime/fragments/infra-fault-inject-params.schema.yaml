$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1#fault-inject-params"
title: FaultInjectMiddlewareParams
description: >
  Constructor kwargs for the ``fault_inject`` infra middleware plugin.
  Selected when the sibling ``middleware`` id is ``fault_inject``
  (aliases ``chaos_lite``, ``chaos-lite``).
type: object
additionalProperties: false
properties:
  rate:
    type: number
    minimum: 0
    maximum: 1
  failure_rate:
    type: number
    minimum: 0
    maximum: 1
    description: Alias for rate.
  status_codes:
    type: array
    items:
      type: integer
  errors:
    type: array
    items:
      type: integer
    description: Alias for status_codes.
  message:
    type: string
