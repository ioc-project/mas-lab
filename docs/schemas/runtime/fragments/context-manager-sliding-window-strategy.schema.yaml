$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-manager-sliding-window-strategy"
title: SlidingWindowContextManagerStrategyParams
description: Constructor kwargs for the ``sliding-window`` context-manager plugin.
type: object
properties:
  keep_turns:
    type: integer
    minimum: 1
    default: 10
    description: Recent user turns kept verbatim. Older turns are dropped.
  max_turns:
    type: integer
    minimum: 1
    description: Alias of keep_turns.
  window_size:
    type: integer
    minimum: 1
    description: Alias of keep_turns.
