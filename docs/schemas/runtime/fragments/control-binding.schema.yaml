$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#control-binding"
title: ControlBinding
description: >
  Control-plane knobs keyed by id. Set a key to null to disable.
  ``retry`` and ``circuit_breaker`` are deprecated: they still load and
  become pipeline steps, with a one-time warning. Prefer a ``retry`` /
  ``circuit_breaker`` layer on the infra pipeline. ``budget`` and
  ``rate_limiter`` remain plugin configs.
type: object
additionalProperties: false
properties:
  budget:
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        properties:
          max_tokens:
            type: integer
            minimum: 0
          max_cost_usd:
            type: number
            minimum: 0
  retry:
    type: object
    deprecated: true
    additionalProperties: false
    description: Deprecated. Still applied as a retry pipeline step (one warning).
    properties:
      llm:
        $ref: "./retry-policy.schema.yaml"
      tools:
        $ref: "./retry-policy.schema.yaml"
  circuit_breaker:
    deprecated: true
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            description: When omitted and this object is present, the breaker is on.
          failure_threshold:
            type: integer
            minimum: 1
          reset_timeout_s:
            type: number
            minimum: 0
          "on":
            type: array
            items:
              $ref: "./failure-class.schema.yaml"
            description: Failure classes that count toward opening the breaker.
          plugin:
            type: string
            description: >
              Library plugin name (default ``threshold``). Implementations
              register as ``type: layer`` (``circuit_breaker`` still loads);
              not a kernel slot.
  rate_limiter:
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        properties:
          requests_per_minute:
            type: integer
            minimum: 1
