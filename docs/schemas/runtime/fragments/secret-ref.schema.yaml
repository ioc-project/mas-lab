$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1/fragments/secret-ref"
title: "SecretRef"
description: >
  A pointer at a secret in a store. The manifest never holds the value.
  Short form ``{secret: NAME}`` is name NAME, key value. Long form sets
  name, key, optional, and a non-secret prefix (for example ``Bearer ``).
  A plain string is refused: this fragment is type object.

type: object
additionalProperties: false
required: [secret]
properties:
  secret:
    description: Secret name, or an object with name and key.
    oneOf:
      - type: string
        minLength: 1
        pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
      - type: object
        additionalProperties: false
        required: [name]
        properties:
          name:
            type: string
            minLength: 1
            pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
          key:
            type: string
            minLength: 1
            pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
            default: value
          optional:
            type: boolean
            default: false
          prefix:
            type: string
            pattern: "^(?:[A-Za-z][A-Za-z0-9-]{0,31} )?$"
            description: >
              Non-secret auth scheme word and one space, prepended at reveal
              (for example "Bearer "). Control bytes and a token are refused.
