$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1#middleware-inline"
title: InfraMiddlewareInline
description: >
  Inline interceptor / pipeline step. ``params`` belongs to the plugin named
  by ``middleware`` (or by the referenced InfraMiddleware leaf).
type: object
additionalProperties: false
properties:
  ref:
    type: string
  middleware:
    type: string
    description: Deprecated spelling of layer.
  layer:
    type: string
    description: Registry name of the call layer.
  priority:
    type: integer
    description: Higher wraps outside. Ties break by name.
  id:
    type: string
    description: >
      Name of this step, so an overlay or an experiment can address it (``pipeline[id=retry-llm]``).
      Default ``<layer>-<for>``.
  enabled:
    type: boolean
    description: >
      ``false`` keeps the step listed and does not wrap the call. For ``retry`` it also keeps the
      documented default retry of that call kind from being added.
  for:
    description: Call kinds this step wraps (llm, tool, send). Alias of leftover applies_to.
    oneOf:
      - type: string
      - type: array
        items:
          type: string
  per:
    type: string
    enum: [all, destination]
  applies_to:
    description: Read-only alias of for. Mixing for and applies_to is an error.
    type: array
    items:
      type: string
      enum: [LLM_CALL, TOOL_HTTP, OTEL_EXPORT, llm, tool]
  params:
    $ref: "./infra-middleware-params.schema.yaml"
allOf:
  - $ref: "./infra-middleware-params-by-id.schema.yaml"
