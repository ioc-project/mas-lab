$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#observability-binding"
title: ObservabilityBinding
description: >
  List of observability sink plugin ids (OSS: native, otel). Plugin implementations
  are resolved at runtime from the plugin registry — unknown ids fail at load time.
  Further sinks (for example observe_sdk) come from `mas-library-telemetry`.
type: array
items:
  oneOf:
    - type: string
      enum: [native, otel]
    - type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        native:
          type: object
          additionalProperties: false
          properties:
            path:
              type: string
            events_file:
              type: string
            categories:
              description: >
                Filter exported native records by category prefix (control, tool,
                model, execution). The observability contract still receives every
                event; this only changes what is written to events.jsonl.
              oneOf:
                - type: array
                  items: { type: string }
                - type: object
                  additionalProperties: false
                  properties:
                    include:
                      type: array
                      items: { type: string }
                    exclude:
                      type: array
                      items: { type: string }
                    enable:
                      type: array
                      items: { type: string }
                    disable:
                      type: array
                      items: { type: string }
        otel:
          type: object
          additionalProperties: false
          properties:
            output_path:
              type: string
            otel_file:
              type: string
            converter_profile:
              type: string
            otlp_endpoint_env:
              type: string
            service_name:
              type: string
              description: >
                Ignored as MAS identity. Observe SDK service.name is the
                declared MAS name (metadata.name / app_name).
            app_name:
              type: string
              minLength: 1
              not:
                pattern: "[/\\\\]"
              description: "Declared MAS name. A filesystem path is not a name."
            mas_id:
              type: string
              minLength: 1
              not:
                pattern: "[/\\\\]"
              description: "Declared MAS name. Same contract as app_name."
            realtime:
              type: boolean
            extensions:
              type: boolean
