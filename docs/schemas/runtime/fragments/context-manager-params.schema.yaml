$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-manager-params"
title: ContextManagerParams
description: >
  Default spec.context_manager.params. Assembly knobs are always typed.
  Extra keys stay allowed so a third-party context manager can carry its
  own constructor kwargs. Shipped plugins replace this object with a closed
  per-plugin schema via if/then on the sibling ``type`` field.
allOf:
  - $ref: "./context-manager-assembly-params.schema.yaml"
additionalProperties: true
