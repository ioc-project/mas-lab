$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#execution-binding"
title: ExecutionBinding
description: >
  DEPRECATED — not allowed on Agent or overlay patches. Retained for codegen
  keys only; use kind RuntimeEngine (runtime_refs) and workspace infra_refs.
type: object
additionalProperties: false
properties:
  cache:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: >
          Master on/off switch. false disables both read and write outright,
          regardless of the read/write fields below. Omit (or true) to let
          read/write each control their own default independently.
      read:
        type: boolean
        description: "Look up a cached response before calling the LLM. Default: false."
      write:
        type: boolean
        description: "Persist a response to the cache after calling the LLM. Default: false."
  parallel:
    type: boolean
  engine_queue_depth:
    type: integer
    minimum: 1
    default: 32
    description: >
      Maximum engine egress intents (LLM/tool calls) queued for one kernel
      dispatch batch before drain. Raise when a single model turn schedules
      many parallel tool calls. See docs/manifests/execution.md.
  max_auto_steps:
    type: ["integer", "null"]
    minimum: 1
    default: null
    description: >
      Maximum kernel dispatch-loop iterations (LLM/tool/HITL round-trips)
      the driver auto-advances through for one ingress event before giving
      up with items still queued. Null / omitted means no cap (lab default).
      Set an integer in production (for example 512) or
      a RuntimeEngine manifest. See docs/manifests/execution.md.
  live:
    type: boolean
  stream:
    type: boolean
    description: >
      Stream the LLM response over SSE instead of waiting for the full
      completion, forwarding content deltas to ctx.on_stream_chunk as they
      arrive. Default: false.
  timeout:
    type: number
    minimum: 0
