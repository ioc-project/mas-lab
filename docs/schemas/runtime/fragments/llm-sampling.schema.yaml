$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#llm-sampling"
title: LlmSampling
description: >
  Static Chat Completions sampling knobs on spec.models[] / spec.llm.
  Dynamic per-call overrides belong on LLMProvider.chat_completion.
type: object
additionalProperties: false
properties:
  temperature:
    type: number
    minimum: 0
    maximum: 2
    default: 0.7
  max_tokens:
    type: integer
    minimum: 1
    description: >
      Output-token budget. Omitted means no limit is sent and the server
      default applies (vLLM: remaining context, or its generation-config
      max_new_tokens). Reasoning models send it as max_completion_tokens.
      Bounded by infra generation.max_output_tokens and the catalog
      max_output_tokens.
  max_completion_tokens:
    type: integer
    minimum: 1
    description: >
      Explicit Chat Completions answer+reasoning cap. Wins over max_tokens:
      only one of the two is ever sent. When omitted, reasoning models map
      max_tokens onto this field.
  min_tokens:
    type: integer
    minimum: 0
  min_p:
    type: number
    minimum: 0
    maximum: 1
    description: vLLM / llama.cpp nucleus floor.
  repetition_penalty:
    type: number
    minimum: 0
    description: vLLM / Hugging Face repetition penalty.
  service_tier:
    type: string
  store:
    type: boolean
  metadata:
    type: object
    additionalProperties: true
  modalities:
    type: array
    items:
      type: string
  prediction:
    type: object
    additionalProperties: true
  prompt_cache_key:
    type: string
    description: >
      Open Responses `prompt_cache_key`: a stable string that groups requests
      sharing a prefix so the host can route them to the same cache. Gemini
      reads a `cachedContents/...` name here. See docs/manifests/llm-prompt-cache.md.
  prompt_cache_retention:
    type: string
    enum: [in_memory, 24h, 5m, 1h]
    description: >
      Open Responses `prompt_cache_retention`: how long a cached prefix is kept.
      `in_memory` and `5m` are the short default, `24h` and `1h` the long one.
      Each protocol maps this to what its wire supports (Anthropic and Bedrock
      have a 1h maximum, so `24h` becomes `1h`).
  prompt_cache_breakpoints:
    description: >
      Where explicit-cache protocols (Anthropic, Bedrock) mark the prompt as
      cacheable. Omitted means system, tools and the last two user turns;
      `false` means no marker; an object picks each part.
    oneOf:
      - type: boolean
        const: false
      - type: object
        additionalProperties: false
        properties:
          system:
            type: boolean
          tools:
            type: boolean
          messages:
            type: integer
            minimum: 0
            maximum: 2
  top_p:
    type: number
    minimum: 0
    maximum: 1
  top_k:
    type: integer
    minimum: 0
  presence_penalty:
    type: number
    minimum: -2
    maximum: 2
  frequency_penalty:
    type: number
    minimum: -2
    maximum: 2
  seed:
    type: integer
  n:
    type: integer
    minimum: 1
  stop:
    oneOf:
      - type: string
      - type: array
        items:
          type: string
  logit_bias:
    type: object
    additionalProperties:
      type: number
  user:
    type: string
  verbosity:
    type: string
    enum: [low, medium, high]
  response_format:
    type: object
    additionalProperties: true
  logprobs:
    type: boolean
  top_logprobs:
    type: integer
    minimum: 0
    maximum: 20
  parallel_tool_calls:
    type: boolean
