$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1#runtime-engine-spec"
title: RuntimeEngineSpec
description: >
  Shared kernel and LLM engine tuning for a deployment — queue depth, cache
  policy, streaming, parallel tool calls. Resolved like infra via workspace
  runtime_refs, env MAS_RUNTIME_REFS, or CLI --runtime-ref (not agent/MAS YAML).
type: object
additionalProperties: false
properties:
  engine:
    type: object
    additionalProperties: false
    properties:
      queue_depth:
        type: integer
        minimum: 1
        default: 32
      max_auto_steps:
        type: ["integer", "null"]
        minimum: 1
        default: null
        description: >
          Dispatch-loop cap. Null / omitted means no cap. Production
          agent specs and RuntimeEngine manifests set an
          integer when a runaway loop must stop.
      timeout:
        type: ["number", "null"]
        minimum: 0
      tool_worker:
        type: string
        enum: [inline, thread]
        default: thread
        description: >
          Where sync plugin tools run when a batch of tool calls overlaps.
          `thread` runs each in its own thread; `inline` runs them one after
          another on the event loop. Placement only: a tool sees the same
          frozen context and the results come back in the same order.
          A tool that declares `kernel_state` always runs inline.
      tool_concurrency:
        type: ["integer", "null"]
        minimum: 1
        default: null
        description: >
          How many sync plugin tools may run at once. Null means no cap other
          than the number of calls in the batch.
  cache:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
      read:
        type: boolean
      write:
        type: boolean
  stream:
    type: boolean
  parallel:
    type: boolean
    description: >
      When set, overrides design-pattern parallel_tool_calls for agents using
      parallel_tool_calls for agents on this deployment profile.
