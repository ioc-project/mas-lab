$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1#middleware-params"
title: InfraMiddlewareParams
description: >
  Default ``params`` object for an infra middleware step. Unknown plugin ids
  keep extra keys (third-party middleware). Shipped plugins replace this with
  their own closed schema via ``infra-middleware-params-by-id.schema.yaml``
  on the sibling ``middleware`` field.
type: object
additionalProperties: true
