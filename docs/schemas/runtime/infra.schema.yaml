$schema: "https://json-schema.org/draft-07/schema#"
$id: "infra/v1"
title: "Infra Manifest"
description: >
  Schema for infrastructure manifests (apiVersion: infra/v1). Different ``kind``
  values populate different ``spec`` fields; see InfraManifest in infra_manifest.py.
  InfraBundle composes other infra files via spec.includes (resolved recursively).

type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
additionalProperties: false


allOf:
  - if:
      properties:
        kind: {const: RuntimeEngine}
      required: [kind]
    then:
      properties:
        spec:
          $ref: "./fragments/runtime-engine.schema.yaml"

properties:
  apiVersion:
    type: string
    const: "infra/v1"

  kind:
    type: string
    enum:
      - InfraBundle
      - InfraMiddleware
      - InfraInterceptor
      - LLMProxy
      - LLMLocal
      - ToolServerRegistry
      - PersonalSecrets
      - Application
      - ToolRegistry
      - ToolProvider
      - Datastore
      - SecretsProvider
      - Infrastructure
      - RuntimeEngine
      - ServiceBundle
      - Stack

  metadata:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string

  spec:
    type: object
    description: >
      Kind-specific infrastructure specification. Connection values belong
      in this document. Secrets are SecretRef objects (``{secret: NAME}``).
      Hosts and API bases are plain overlay values. The ``env:`` prefix and
      ``*_env`` keys are removed.
    additionalProperties: true
    not:
      anyOf:
        - required: [api_key_env]
        - required: [secret_env]
        - required: [password_env]
        - required: [embed_api_key_env]
        - required: [otlp_endpoint_env]
    allOf:
      - $ref: "./fragments/infra-middleware-params-by-id.schema.yaml"
    properties:
      # ── InfraBundle ─────────────────────────────────────────────────────
      entries:
        type: array
        description: >
          Typed infra slots (Phase 10). Each entry resolves a leaf manifest and
          optional serial pipeline. Preferred over ``includes`` + ``interceptors``.
        items:
          $ref: "./fragments/infra-entry.schema.yaml"

      includes:
        type: array
        description: "Paths or library refs (e.g. standard:openai) merged into one InfraManifest."
        items:
          type: string

      interceptors:
        type: array
        description: >
          Read-only alias of pipeline. Mixing pipeline and interceptors
          is an error.
        items:
          oneOf:
            - type: string
            - $ref: "./fragments/infra-middleware-inline.schema.yaml"

      runtime_engine:
        $ref: "./fragments/runtime-engine.schema.yaml"

      middleware:
        type: string
        description: "Deprecated spelling of layer on an InfraMiddleware leaf."
      layer:
        type: string
        description: "InfraMiddleware leaf: registry id of the call layer."
      priority:
        type: integer
        description: Higher wraps outside. Ties break by name.
      id:
        type: string
        description: Name of this step, so an overlay or an experiment can address it.
      enabled:
        type: boolean
        description: "false keeps the step listed and does not wrap the call."

      for:
        description: >
          InfraMiddleware/InfraInterceptor: call kinds this step wraps
          (llm, tool). Default comes from the plugin (cache, scheduler,
          and fault_inject wrap llm).
        oneOf:
          - type: string
          - type: array
            items:
              type: string

      per:
        type: string
        enum: [all, destination]
        description: >
          all = one shared copy; destination = one copy per LLM leaf or
          tool server. Default comes from the plugin.

      applies_to:
        type: array
        description: >
          Read-only alias of for. Mixing for and applies_to is an error.
        items:
          type: string
        default: [LLM_CALL]

      pipeline:
        type: array
        description: >
          Ordered call-layer steps (canonical on LLMProxy / InfraBundle /
          Application / ToolServerRegistry). interceptors is a read-only
          alias; mixing both is an error. middleware on a step is the
          deprecated spelling of layer.
        items:
          oneOf:
            - type: string
            - $ref: "./fragments/infra-middleware-inline.schema.yaml"

      # ── LLMProxy / LLMLocal / Infrastructure ────────────────────────────
      protocol:
        type: string
        description: >
          Sugar for a layer or a Stack. On an LLMProxy leaf this is the
          wire-protocol plugin (``openai``, ``anthropic``, ``gemini``,
          ``azure``, ``bedrock``, ``vertex``, ``openresponses``, ``groq``, ``openrouter``, ``xai``,
          ``litellm``, ``cerebras``, ``mistral``, ``vllm``, ``huggingface``,
          ``databricks``, …) and expands
          to ``[http, <protocol>]`` when a url
          is set. On a ToolServerRegistry row, ``mcp`` plus a url expands to
          ``[http, mcp]``. Ollama uses ``openai``. Default is the library
          ``llm_provider`` default. Not ``mock`` or ``cache`` — offline CI
          uses ``llm_cache`` replay (``raise_on_miss``); cache wraps the
          routed protocol plugin.
        default: openai

      layers:
        type: array
        description: >
          Stack kind: named layers, bottom first (transport then protocol
          then wrap). ``protocol: openai`` on an LLMProxy stays sugar for
          this list.
        items:
          $ref: "./fragments/infra-middleware-inline.schema.yaml"

      proxy:
        type: object
        additionalProperties: true
        not:
          anyOf:
            - required: [api_key_env]
            - required: [secret_env]
            - required: [password_env]
            - required: [embed_api_key_env]
            - required: [otlp_endpoint_env]
        properties:
          api_base:
            type: string
            description: OpenAI-compatible base URL. Set in the overlay or Flavour.
          api_key:
            description: >
              SecretRef for the endpoint key. Omitted, the protocol's default secret (for example
              ``openai``) is used only while ``api_base`` is empty or the protocol's own default endpoint;
              any other host needs this set. ``{secret: {name: NAME, optional: true}}`` is for a server
              that may take no key: no auth header is sent while the secret is not set.
            allOf:
              - $ref: "./fragments/secret-ref.schema.yaml"
          timeout:
            type: number
            description: >
              HTTP request timeout in seconds for LLM API calls. Defaults to 120.

      server:
        type: object
        description: "LLMLocal: OpenAI-compatible endpoint (alias for proxy fields)."
        additionalProperties: true
        properties:
          api_base:
            type: string
          api_key:
            description: >
              SecretRef for the endpoint key (same rules as ``proxy.api_key``). Omitted, the protocol's default secret (for example
              ``openai``) is used only while ``api_base`` is empty or the protocol's own default endpoint;
              any other host needs this set. ``{secret: {name: NAME, optional: true}}`` is for a server
              that may take no key: no auth header is sent while the secret is not set.
            allOf:
              - $ref: "./fragments/secret-ref.schema.yaml"
          timeout:
            type: number
            description: >
              HTTP request timeout in seconds for LLM API calls. Defaults to 120.

      models:
        type: object
        additionalProperties: true
        properties:
          allowed:
            type: array
            items:
              type: string
          available:
            type: array
            description: "LLMLocal alias for allowed model list."
            items:
              type: string
          defaults:
            type: object
            properties:
              llm:
                type: string
              embed:
                type: string
          mappings:
            type: object
            additionalProperties:
              type: string
          generation:
            type: object
            additionalProperties: false
            description: >
              LLMProxy/LLMLocal: operator output-token policy for every model
              served by this endpoint. max_tokens / max_completion_tokens /
              on_truncation are defaults below spec.models[]; max_output_tokens
              is a ceiling that bounds every value, including CLI and env
              overrides. Omit the block to send no limit (server default).
            properties:
              max_tokens:
                type: integer
                minimum: 1
              max_completion_tokens:
                type: integer
                minimum: 1
              max_output_tokens:
                type: integer
                minimum: 1
                description: >
                  Hard ceiling. Match the server limit (e.g. vLLM
                  generation-config max_new_tokens).
              on_truncation:
                $ref: "./fragments/llm-truncation.schema.yaml"
              context_window:
                type: integer
                minimum: 1
                description: >
                  Input context-window override for the resolved endpoint. A
                  model-level context_window takes precedence; otherwise the
                  runtime model catalog is used.
              pricing:
                type: object
                additionalProperties: false
                description: >
                  Optional operator pricing override in USD per million tokens.
                  Values replace the model catalog rates for cost estimates.
                properties:
                  input_per_million_tokens:
                    type: number
                    minimum: 0
                  cached_input_per_million_tokens:
                    type: number
                    minimum: 0
                  output_per_million_tokens:
                    type: number
                    minimum: 0

      endpoints:
        description: "Application: map of id → endpoint. LLMProxy: may be a list with name field."
        oneOf:
          - type: object
            additionalProperties:
              $ref: "./fragments/application-endpoint.schema.yaml"
          - type: array
            items:
              type: object
              additionalProperties: true

      # ── ToolServerRegistry ─────────────────────────────────────────────────────
      tool_servers:
        type: array
        items:
          $ref: "./fragments/infra-tool-server.schema.yaml"

      # ── ToolRegistry ────────────────────────────────────────────────────
      tools:
        description: "ToolRegistry: logical tool-set id → JSON index path. ToolProvider: semantic tool bindings."
        oneOf:
          - type: array
            items:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id:
                  type: string
                path:
                  type: string
                description:
                  type: string
          - type: object
            additionalProperties:
              $ref: "./fragments/infra-tool-binding.schema.yaml"

      # ── PersonalSecrets ─────────────────────────────────────────────────
      token_refs:
        type: array
        items:
          type: object
          required: [id, api_key]
          additionalProperties: true
          properties:
            id:
              type: string
            api_key:
              $ref: "./fragments/secret-ref.schema.yaml"
            description:
              type: string

      # ── Datastore ───────────────────────────────────────────────────────
      stores:
        type: object
        description: "Named datastore connections (Neo4j, ClickHouse, filesystem, …)."
        additionalProperties:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
            uri:
              type: string
            host:
              type: string
            port:
              type: integer
            path:
              type: string
            user:
              type: string
            password:
              $ref: "./fragments/secret-ref.schema.yaml"
            database:
              type: string
            description:
              type: string
            artifacts:
              type: array
              description: "Artifact kinds this store handles (otel_traces, events, kg, …)."
              items:
                type: object
                properties:
                  kind:
                    type: string
                  ops:
                    type: array
                    items:
                      type: string
                      enum: [read, write, query]

      # ── ServiceBundle ───────────────────────────────────────────────────
      services:
        type: object
        description: >
          Named processes or compose stacks started by mas-lab
          ``service_start`` / ``service_stop`` (not LLM ``--infra-ref``).
        additionalProperties:
          type: object
          additionalProperties: true
          properties:
            description:
              type: string
            backend:
              type: string
              enum: [process, docker-compose, catalogue]
            command:
              oneOf:
                - type: array
                  items:
                    type: string
                - type: string
            compose_file:
              type: string
            auto_start:
              type: boolean
            env:
              type: object
              description: >-
                Variables of the service. A plain value is also exported to the run (overlay only); a
                SecretRef (``{secret: NAME}``) is revealed into this service's own child only.
              additionalProperties:
                oneOf:
                  - type: string
                  - $ref: "./fragments/secret-ref.schema.yaml"
            health_check:
              type: object
              additionalProperties: true
              properties:
                url:
                  type: string
                timeout:
                  type: integer
            triggers:
              type: object
              additionalProperties: true

      # ── SecretsProvider ─────────────────────────────────────────────────
      provider:
        type: string
        description: "Secrets backend id (e.g. env, vault)."
      params:
        $ref: "./fragments/infra-middleware-params.schema.yaml"
