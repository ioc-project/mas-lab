# Guardrail for with-vector-memory-guardrail: block Shadowmere.
apiVersion: control/v1
kind: Control
metadata:
  name: with-vector-memory-guardrail
spec:
  governance:
  - sample_governance:
      policies:
      - name: forbidden-destination
        trigger:
          'on': tool_input
          tool: '*'
          condition: arguments.destination == "Shadowmere"
          evaluation: deterministic
        action: block
        params:
          message: 'Restricted destination: Shadowmere is not available in the Arborian
            Network booking system.

            '
