apiVersion: control/v1
kind: Control
metadata:
  name: governance-policies
spec:
  observability:
  - mas.observability.native
  governance:
  - sample_governance:
      policies:
      - name: high-cost-approval
        trigger:
          'on': tool_output
          tool: fare_estimation
          condition: result.total_cost_usd > 500
          evaluation: deterministic
        action: hitl
        params:
          auto_approve: false
          timeout_s: 30
          resolution_mode: dataset_pool
      - name: forbidden-destination
        trigger:
          'on': tool_input
          tool: flight_search
          condition: arguments.destination in ['NK', 'SY']
          evaluation: deterministic
        action: block
        params:
          message: Sanctioned destination
