apiVersion: control/v1
kind: Control
metadata:
  name: with-guardrail-fault
spec:
  observability:
  - mas.observability.native
  governance:
  - sample_governance:
      policies:
      - name: forbidden-destination
        trigger:
          'on': tool_input
          tool: '*'
          condition: arguments.destination == "Shadowmere"
          evaluation: deterministic
        action: block
        params:
          message: 'Restricted destination: Shadowmere'
