apiVersion: control/v1
kind: Control
metadata:
  name: with-budget-low
spec:
  observability:
  - mas.observability.native
  governance:
  - sample_governance:
      policies:
      - name: budget-cap-low
        trigger:
          'on': budget_threshold
          condition: cumulative.total_cost_usd > 0.005
          evaluation: deterministic
        action: terminate
        params:
          reason: Budget exceeded ($0.02 limit — deliberately low for testing)
