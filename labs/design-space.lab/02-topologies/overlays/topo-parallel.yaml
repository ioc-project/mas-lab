apiVersion: mas/v1
kind: Overlay
metadata:
  id: topo-parallel
  description: >
    Parallel topology. The moderator's deterministic_parallel design pattern
    sends the task to every specialist in one batch of tool calls, then
    aggregates the results.
  tags: [topology, exp-1.2]

spec:
  target:
    kind: MAS
  patch:
    workflow:
      entry: moderator
      nodes:
        - id: moderator
          delegates_to: [schedule_agent, itinerary_agent, concierge_agent]
        - id: schedule_agent
        - id: itinerary_agent
        - id: concierge_agent
    agents:
      moderator:
        design_pattern:
          type: deterministic_parallel
