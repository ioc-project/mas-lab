apiVersion: mas/v1
kind: Agent
metadata:
  name: qa-agent
spec:
  context:
    intent: Answer general knowledge questions.
    role: 'Answer questions clearly and concisely.

      When you need to perform calculations, use the calc tool.

      When you need current information from the web, use the web-search tool.

      '
  models:
  - model: azure/gpt-4o-mini
    temperature: 0.7
    max_tokens: 4096
  tools:
  - ref: ../../../../../library-samples/tools/web-search.tool.yaml
  - ref: ../../../../../library-samples/tools/calc.tool.yaml
  description: Answer general knowledge questions.
