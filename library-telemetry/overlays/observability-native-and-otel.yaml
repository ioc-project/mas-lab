# Keep native events.jsonl and add live OTel JSONL (replay/compare path).
apiVersion: control/v1
kind: Control
metadata:
  name: observability-native-and-otel
spec:
  observability:
  - mas.observability.native:
      path: traces/events.jsonl
  - otel:
      output_path: traces/otel_sdk_spans.jsonl
      converter_profile: observe_sdk
