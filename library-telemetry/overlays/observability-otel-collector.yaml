# Live OTel plugin: JSONL plus OTLP. otlp_endpoint is the collector's OTLP
# HTTP base URL (the local collector of docker/compose.yaml); override it in an
# overlay for another collector. An infra OtelCollector manifest is optional.
apiVersion: control/v1
kind: Control
metadata:
  name: observability-otel-collector
spec:
  observability:
  - otel:
      output_path: traces/otel_sdk_spans.jsonl
      converter_profile: observe_sdk
      otlp_endpoint: http://localhost:4318
