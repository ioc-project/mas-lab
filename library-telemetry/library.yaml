name: telemetry
description: Native-events-to-OTel conversion, span verification, and OTLP collector serialization.
version: "0.1.0"

types:
  - observability
  - step

plugins:
  - type: observability
    name: otel
    urn: mas.observability.otel
    module: mas.library.telemetry.plugins.otel_plugin
    class: OtelObservabilityPlugin
    attributes:
      run_path_params: [output_path]
    requires: [opentelemetry.sdk.trace]
    extra: convert
    warm:
      - ioa_observe.sdk.tracing.runtime_events
      - ioa_observe.sdk.utils.const
      - mas.library.telemetry.conversion.semconv
      - mas.library.telemetry.conversion.converter
      - mas.library.telemetry.conversion.session
  - type: step
    name: events_to_otel
    module: mas.library.telemetry.bench
    class: EventsToOtelStep
    attributes:
      worker_safe: true
  - type: step
    name: verify_otel
    module: mas.library.telemetry.bench
    class: VerifyOtelStep
    attributes:
      worker_safe: true
  - type: step
    name: compare_otel_spans
    module: mas.library.telemetry.bench
    class: CompareOtelSpansStep
    attributes:
      worker_safe: true
  - type: step
    name: export_otel
    module: mas.library.telemetry.bench
    class: ExportOtelStep
    attributes:
      worker_safe: true
  - type: step
    name: clickhouse_dump
    module: mas.library.telemetry.bench
    class: ClickhouseDumpStep
    attributes:
      worker_safe: true
  - type: step
    name: list_clickhouse_sessions
    module: mas.library.telemetry.steps.list_clickhouse_sessions
    class: ListClickhouseSessionsStep
    attributes:
      worker_safe: true
