name: setup-mas
description: Install uv, the requested Python, and go-task (optionally task install-dev).

inputs:
  python-version:
    description: CPython version for uv python install
    required: false
    default: "3.13"
  install-dev:
    description: Run task install-dev after tool setup
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true

    - name: Setup Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install go-task
      shell: bash
      run: |
        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "${{ runner.temp }}/bin"
        echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

    - name: Install dev environment
      if: ${{ inputs.install-dev == 'true' }}
      shell: bash
      run: task install-dev
