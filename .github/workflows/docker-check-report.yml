#
# Tracks a failing scheduled "Docker check" in one issue. A workflow of its own because docker.yml
# calls the check, and a called workflow cannot ask for more permissions than its caller has.
name: Docker check report

on:
  workflow_run:
    workflows: ["Docker check"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Report a failed scheduled run
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One open issue per failing streak, not one per run.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Docker image check is failing"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          body="The scheduled image build or scan failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
