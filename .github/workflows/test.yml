#
# Path filters live on jobs (scripts/ci_paths.py), not on `on:`.
# The repository ruleset on main requires the exact check name ci-summary.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.paths.outputs.unit }}
      unit_matrix: ${{ steps.paths.outputs.unit_matrix }}
      runtime: ${{ steps.paths.outputs.runtime }}
      ctl: ${{ steps.paths.outputs.ctl }}
      lab_unit: ${{ steps.paths.outputs.lab_unit }}
      repo: ${{ steps.paths.outputs.repo }}
      unit_311: ${{ steps.paths.outputs.unit_311 }}
      controller: ${{ steps.paths.outputs.controller }}
      smoke: ${{ steps.paths.outputs.smoke }}
      golden: ${{ steps.paths.outputs.golden }}
      tutorials: ${{ steps.paths.outputs.tutorials }}
      validate: ${{ steps.paths.outputs.validate }}
      hitl: ${{ steps.paths.outputs.hitl }}
      docs: ${{ steps.paths.outputs.docs }}
      demo_ui: ${{ steps.paths.outputs.demo_ui }}
      mcp: ${{ steps.paths.outputs.mcp }}
      a2a: ${{ steps.paths.outputs.a2a }}
      lib_standard: ${{ steps.paths.outputs.lib_standard }}
      lib_eval: ${{ steps.paths.outputs.lib_eval }}
      lib_ioa: ${{ steps.paths.outputs.lib_ioa }}
      lib_telemetry: ${{ steps.paths.outputs.lib_telemetry }}
      lib_kg: ${{ steps.paths.outputs.lib_kg }}
      lib_skills: ${{ steps.paths.outputs.lib_skills }}
      lib_samples: ${{ steps.paths.outputs.lib_samples }}
      lib_lab: ${{ steps.paths.outputs.lib_lab }}
      suite: ${{ steps.paths.outputs.suite }}
      library: ${{ steps.paths.outputs.library }}
      suite_matrix: ${{ steps.paths.outputs.suite_matrix }}
      library_matrix: ${{ steps.paths.outputs.library_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: paths
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_paths.py >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lock, literals, ruff on changed Python
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task verify-lint

  docs:
    name: Docs
    needs: [changes, lint]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - run: task verify-docs
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build MkDocs site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build

  unit:
    name: ${{ matrix.name }}
    needs: [changes, lint]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Tests and changed-line coverage
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task ${{ matrix.task }} COVERAGE=1 COVERAGE_PACKAGE=${{ github.event_name != 'pull_request' && '1' || '0' }}

  unit-311:
    name: Unit (3.11)
    needs: [changes, lint]
    if: needs.changes.outputs.unit_311 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.11"
          install-dev: "true"
      - run: task verify-unit

  suite:
    name: ${{ matrix.name }}
    needs: [changes, lint]
    if: needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.suite_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - run: task ${{ matrix.task }}

  library:
    name: Library (${{ matrix.name }})
    needs: [changes, lint]
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.library_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lint, test, and changed-line coverage
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task verify-library LIB=${{ matrix.dir }} COV=${{ matrix.cov }} FAIL_UNDER=${{ matrix.fail_under }}

  demo-ui:
    name: Demo UI
    needs: [changes, lint]
    if: needs.changes.outputs.demo_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Demo UI host tests
        working-directory: demo-ui
        run: node --test src/*.test.js

  compliance:
    name: Compliance
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.mcp == 'true' || needs.changes.outputs.a2a == 'true' }}
    uses: ./.github/workflows/compliance.yml
    with:
      mcp: ${{ needs.changes.outputs.mcp == 'true' }}
      a2a: ${{ needs.changes.outputs.a2a == 'true' }}
    secrets: inherit

  # Repository ruleset on main requires this exact check name.
  ci-summary:
    name: ci-summary
    if: always()
    needs:
      - changes
      - lint
      - docs
      - unit
      - unit-311
      - suite
      - library
      - demo-ui
      - compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJson(needs) }}
          EXPECTED: ${{ toJson(needs.changes.outputs) }}
        run: python3 scripts/ci_gate.py
