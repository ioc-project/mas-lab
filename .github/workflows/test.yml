#
# Path filters live on jobs (scripts/ci_paths.py), not on `on:`.
# The repository ruleset on main requires the exact check name ci-summary.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.paths.outputs.unit }}
      unit_311: ${{ steps.paths.outputs.unit_311 }}
      controller: ${{ steps.paths.outputs.controller }}
      smoke: ${{ steps.paths.outputs.smoke }}
      golden: ${{ steps.paths.outputs.golden }}
      tutorials: ${{ steps.paths.outputs.tutorials }}
      validate: ${{ steps.paths.outputs.validate }}
      hitl: ${{ steps.paths.outputs.hitl }}
      docs: ${{ steps.paths.outputs.docs }}
      demo_ui: ${{ steps.paths.outputs.demo_ui }}
      ioa: ${{ steps.paths.outputs.ioa }}
      lib_standard: ${{ steps.paths.outputs.lib_standard }}
      lib_eval: ${{ steps.paths.outputs.lib_eval }}
      lib_ioa: ${{ steps.paths.outputs.lib_ioa }}
      lib_telemetry: ${{ steps.paths.outputs.lib_telemetry }}
      lib_kg: ${{ steps.paths.outputs.lib_kg }}
      lib_skills: ${{ steps.paths.outputs.lib_skills }}
      lib_samples: ${{ steps.paths.outputs.lib_samples }}
      lib_lab: ${{ steps.paths.outputs.lib_lab }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: paths
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_paths.py >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lock, literals, ruff on changed Python
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task verify-lint

  docs:
    name: Docs
    needs: [changes, lint]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - run: task verify-docs
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build MkDocs site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build

  unit:
    name: Unit
    needs: [changes, lint]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Unit tests and changed-line coverage
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task verify-coverage COVERAGE_PACKAGE=${{ github.event_name != 'pull_request' && '1' || '0' }}

  unit-311:
    name: Unit (3.11)
    needs: [changes, lint]
    if: needs.changes.outputs.unit_311 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.11"
          install-dev: "true"
      - run: task verify-unit

  suite:
    name: ${{ matrix.name }}
    needs: [changes, lint]
    if: ${{ needs.changes.outputs[matrix.flag] == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: controller
            name: Controller
            task: verify-controller
          - flag: smoke
            name: Lab smoke
            task: verify-lab-smoke
          - flag: golden
            name: Golden runs
            task: verify-golden-runs
          - flag: tutorials
            name: Tutorials
            task: verify-tutorials
          - flag: validate
            name: Dry-run
            task: validate
          - flag: hitl
            name: HITL
            task: verify-hitl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - run: task ${{ matrix.task }}

  library:
    name: Library (${{ matrix.name }})
    needs: [changes, lint]
    if: ${{ needs.changes.outputs[matrix.flag] == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flag: lib_standard
            name: standard
            dir: library-standard
            cov: mas.library.standard
            fail_under: "90"
          - flag: lib_eval
            name: eval
            dir: library-eval
            cov: mas.library.eval
            fail_under: "90"
          - flag: lib_ioa
            name: ioa
            dir: library-ioa
            cov: library_ioa
            fail_under: "90"
          - flag: lib_telemetry
            name: telemetry
            dir: library-telemetry
            cov: mas.library.telemetry
            fail_under: "90"
          - flag: lib_kg
            name: kg
            dir: library-kg
            cov: mas.library.kg
            fail_under: "80"
          - flag: lib_skills
            name: skills
            dir: library-skills
            cov: mas.library.skills
            fail_under: "90"
          - flag: lib_samples
            name: samples
            dir: library-samples
            cov: mas.library.samples
            fail_under: "90"
          - flag: lib_lab
            name: lab
            dir: library-lab
            cov: mas.library.lab
            fail_under: "90"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-mas
        with:
          python-version: "3.13"
          install-dev: "true"
      - uses: ./.github/actions/fetch-base
        with:
          sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lint, test, and changed-line coverage
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task verify-library LIB=${{ matrix.dir }} COV=${{ matrix.cov }} FAIL_UNDER=${{ matrix.fail_under }}

  demo-ui:
    name: Demo UI
    needs: [changes, lint]
    if: needs.changes.outputs.demo_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Demo UI host tests
        working-directory: demo-ui
        run: node --test src/*.test.js

  compliance:
    name: Compliance
    needs: [changes, lint]
    if: needs.changes.outputs.ioa == 'true'
    uses: ./.github/workflows/compliance.yml
    secrets: inherit

  # Repository ruleset on main requires this exact check name.
  ci-summary:
    name: ci-summary
    if: always()
    needs:
      - changes
      - lint
      - docs
      - unit
      - unit-311
      - suite
      - library
      - demo-ui
      - compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: All required jobs passed
        env:
          NEEDS: ${{ toJson(needs) }}
          EXPECTED: ${{ toJson(needs.changes.outputs) }}
        run: python3 scripts/ci_gate.py
