name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - runtime
          - ctl
          - library
          - skills
          - samples
          - eval
          - lab-library
          - ioa
          - kg
          - telemetry
          - lab
          - core
          - bench
          - controller
      bump_type:
        description: "Version bump type"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - rc
        default: "none"
      publish:
        description: "Upload artifacts to public PyPI"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-compliance-release:
    name: MCP compliance release report
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Install go-task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "${{ runner.temp }}/bin"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Install MCP compliance dependencies
        run: task --dir library-ioa/compliance/mcp install

      - name: Validate MCP compliance configuration
        run: task --dir library-ioa/compliance/mcp validate-config

      - name: Run MCP unit tests
        run: .venv/bin/pytest library-ioa/tests/mcp -q

      - name: Run both MCP requirement sets
        run: |
          MCP_CONFORMANCE_RESULTS="${{ github.workspace }}/library-ioa/compliance/mcp/results" \
            ./library-ioa/compliance/mcp/mcp-conformance.sh

      - name: Upload release MCP compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-compliance-${{ github.ref_name }}
          path: library-ioa/compliance/mcp/results/
          if-no-files-found: warn
          retention-days: 90

  plan:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select packages to publish
        id: select
        env:
          INPUT: ${{ github.event.inputs.package || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # Order matters: dependencies must be built first. mas-lab is the
          # empty meta-package and must be last.
          packages = [
              ("runtime", "runtime"),
              ("skills", "library-skills"),
              ("library", "library-standard"),
              ("samples", "library-samples"),
              ("ioa", "library-ioa"),
              ("telemetry", "library-telemetry"),
              ("kg", "library-kg"),
              ("ctl", "ctl"),
              ("core", "lab/components/core"),
              ("bench", "lab/components/bench"),
              ("eval", "library-eval"),
              ("controller", "lab/components/controller"),
              ("lab-library", "library-lab"),
              ("lab", "."),
          ]
          sel = os.environ["INPUT"]
          include = [
              {"name": n, "path": p}
              for n, p in packages
              if sel == "all" or sel == n
          ]
          print("matrix=" + json.dumps({"include": include}))
          PY

  publish:
    needs: plan
    runs-on: ubuntu-latest
    # One GitHub environment per package (pypi-<name>), so each PyPI project
    # can have its own trusted publisher and protection rules.
    environment:
      name: pypi-${{ matrix.name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build tools
        run: |
          uv tool install build
          uv tool install twine

      - name: Bump version (if requested)
        if: >
          github.event_name ==
          'workflow_dispatch' && inputs.publish == true &&
          github.event.inputs.bump_type != 'none'
        run: |
          python3 scripts/version_manager.py bump \
            ${{ github.event.inputs.bump_type }} \
            ${{ matrix.name }}

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 scripts/version_manager.py get ${{ matrix.name }})
          FULL=$(python3 scripts/version_manager.py get-full ${{ matrix.name }})
          echo "base=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pyproject-build "${{ matrix.path }}"

      - name: Check package
        run: uvx twine check "${{ matrix.path }}/dist/"*

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist/
          skip-existing: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/*
          retention-days: 30

  commit-version:
    needs: publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type
      != 'none' && inputs.publish == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump all versions
        run: |
          python3 scripts/version_manager.py bump \
            ${{ github.event.inputs.bump_type }} \
            ${{ github.event.inputs.package }}

      - name: Commit and tag
        run: |
          VERSION=$(python3 scripts/version_manager.py get lab)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION -- ':(glob)**/pyproject.toml'
          git commit -m "chore: bump version to $VERSION" || true
          git tag "v$VERSION"
          git push && git push --tags
