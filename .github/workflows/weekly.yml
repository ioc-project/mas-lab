#
# Protocol conformance, weekly. The MCP and A2A conformance suites come from outside this repository, so
# they can start failing with no commit here. Everything else the old daily run did is covered elsewhere:
# the unit and library tests run on every change that touches them, on main, and for every Python version
# in python-matrix.yml.
name: Weekly

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: true

jobs:
  compliance:
    uses: ./.github/workflows/compliance.yml
    secrets: inherit
