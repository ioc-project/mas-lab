apiVersion: infra/v1
kind: ToolServerRegistry

metadata:
  name: loopback-tools
  description: Loopback MCP work tool for the throughput lab.

spec:
  tool_servers:
    - id: work-mcp
      protocol: mcp
      usage: connect
      transport: streamable-http
      url: http://127.0.0.1:18766/mcp
      timeout: 30
      tools: "*"
