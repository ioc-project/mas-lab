[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-lab"
version = "0.2.0"
description = "MAS Lab — Multi-Agent System experimentation, benchmarking, and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MAS Framework Contributors"}]
keywords = ["agents", "multi-agent", "benchmark", "evaluation", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mas-runtime",
    "mas-ctl",
    "mas-lab-core",
    "mas-lab-bench",
    "mas-lab-controller",
    "mas-library-eval",
    "jsonschema>=4.26.0",
]

# No optional extras: lab-specific backends (e.g. Letta in labs/extensions.lab)
# are declared per-lab in <lab>/requirements.txt and installed into a dedicated
# venv via `task install-lab`. They are deliberately kept out of this package
# because some of them conflict with core workspace dependencies.

[project.urls]
Homepage = "https://github.com/ioc-project/mas-lab"
Documentation = "https://github.com/ioc-project/mas-lab/tree/main/docs"
Issues = "https://github.com/ioc-project/mas-lab/issues"

[project.scripts]
mas-lab = "mas.lab.cli:app"
mas-ctl = "mas.ctl.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]
