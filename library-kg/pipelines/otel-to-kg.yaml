# OTel spans (already on disk, e.g. from telemetry:dump-session or
# telemetry:native-to-otel-json) → KG, standalone.
#
# Mirrors `mas-lab kg otel-to-kg`: normalize_otel returns the graph of SCOPE
# norm for the spans, untouched (steps.normalize_otel.run_normalize_otel).
apiVersion: mas/v1
kind: Pipeline

metadata:
  name: kg-otel-to-kg
  description: Verify-free OTel spans → kg.json (SCOPE norm), standalone.

spec:
  steps:
    - name: normalize-otel-kg
      type: normalize_otel
      per_run: true
      config:
        artifact: kg_otel
        # filename defaults to otel_sdk_spans.jsonl; override via
        # --var filename=... or config.filename for a different input name
        # (e.g. the output of telemetry:dump-session).
        filename: "{filename}"

    - name: validate-otel-kg
      type: validate_kg
      per_run: true
      depends_on: [normalize-otel-kg]
      config:
        fail_on_error: true
        strict: false
