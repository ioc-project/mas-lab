[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-lab-library-kg"
version = "0.2.0"
description = "MAS Lab trace normalization and knowledge-graph validation algorithms."
requires-python = ">=3.10"
# Ontology TTL + generated KG models come from SCOPE
# (https://github.com/ioc-project/scope, package ioc-scope-ontology).
# OTel→KG dispatch lives in `norm` (optional extra `[norm]`, PyPI package `ioc-scope-norm`).
dependencies = [
  "ioc-scope-ontology[models]>=1.1.0",
]

[project.optional-dependencies]
# Canonical SCOPE ontology. Also a required dependency above; kept as
# an extra so existing `mas-lab-library-kg[ontology]` installs keep working.
ontology = [
  "ioc-scope-ontology[models]>=1.1.0",
]
# Ontology-driven normalization + KG structural/SHACL validation (parses RDF/TTL).
graph = [
  "rdflib>=6.0.0",
  "pyshacl>=0.25.0",
]
# Full KG validation stack.
validation = [
  "ioc-scope-ontology[models]>=1.1.0",
  "rdflib>=6.0.0",
  "pyshacl>=0.25.0",
]
# events.jsonl validation — JSON Schema envelope + per-kind YAML spec.
verify = [
  "jsonschema>=4.0.0",
  "pyyaml>=6.0.0",
]
# Neo4j serialization support
neo4j = [
  "neo4j>=5.0",
]
# Benchmark-pipeline adapters (PipelineStep wrappers in mas.library.kg.bench)
# + the `mas-lab kg` CLI component (mas.library.kg.lab_cli).
# Discovered via the entry-point groups below.
bench = [
  "mas-lab-component-bench",
  "click>=8.0",
]
# KG-driven plotting (multilevel trajectory swim-lanes) — needs the bench
# framework + the mas-lab plotting renderer (mas.lab.plots).
plot = [
  "mas-lab-component-bench",
]
# SCOPE's OTel normaliser (import name `norm`, PyPI name `ioc-scope-norm`).
norm = [
  "ioc-scope-norm>=1.0.0",
]
# observability/path_equivalence.py's native-vs-OTel-via-norm comparator
# lazily imports mas.library.telemetry (the emitter side) to synthesize the
# OTel leg of the comparison from the same native events -- not a runtime
# dependency of library-kg itself, only of this one dev/CI tool. Resolves
# as a plain workspace member once mas-lab-library-telemetry has landed in this
# same mas-lab workspace (see feat/library-telemetry); until both branches
# are merged together, installing this extra from either branch alone will
# fail to resolve.
compare-native-otel = [
  "mas-lab-library-telemetry",
]
# Everything, for development / CI
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-asyncio>=0.21",
  "click>=8.0",
  "ruff>=0.12.10",
  "ioc-scope-ontology[models]>=1.1.0",
  "rdflib>=6.0.0",
  "pyshacl>=0.25.0",
  "jsonschema>=4.0.0",
  "pyyaml>=6.0.0",
]
# Complete CI run. Includes the [norm] git stopgap so OTel→KG tests can run
# when network is available; local loops can use [dev] only.
all = [
  "mas-lab-library-kg[dev,neo4j,norm]",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

# No standalone console script — the library exposes its functionality as
# pipeline steps + the `mas-lab kg` CLI component (lab_cli.py). The Python API
# (mas.library.kg.*) remains the programmatic entry point.

[project.entry-points."mas.lab.cli.components"]
kg = "mas.library.kg.lab_cli:KgCliComponent"

# KG-driven plot processor (KnowledgeGraph → swim-lane PlotFile).
[project.entry-points."mas.lab.processors"]
multilevel_trajectory_kg_plotter = "mas.library.kg.plots:MultilevelTrajectoryKGPlotter"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["mas/library/kg"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[project.entry-points."mas.runtime.manifest_libraries"]
# Short scheme name → refs read like a URN: `kg:pipelines/native-to-neo4j`
# (`.yaml` suffix and `pipelines/` prefix optional — see resolve_path_ref).
kg = "mas.library.kg"

[tool.hatch.build.targets.wheel.force-include]
"schemas/events.schema.json" = "mas/library/kg/schemas/events.schema.json"
"schemas/events.spec.yaml" = "mas/library/kg/schemas/events.spec.yaml"
"ontology/extensions/mas-kg-native-extensions.ttl" = "mas/library/kg/ontology_extensions/mas-kg-native-extensions.ttl"

