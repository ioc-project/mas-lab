apiVersion: mas/v1
kind: MAS
metadata:
  name: trip-planner-parallel
  description: >
    Trip Planner MAS for the parallel topology id. Its graph is the same as
    moderator-broker: the moderator's model may call several specialists in
    one batch of parallel tool calls. A fixed fan-out to every specialist is
    the moderator's deterministic_parallel design pattern (see the
    topo-parallel overlay in labs/design-space.lab/02-topologies).
spec:
  agency:
    agents:
      - id: concierge_agent
        ref: ../agents/concierge_agent.yaml
      - id: itinerary_agent
        ref: ../agents/itinerary_agent.yaml
      - id: moderator
        ref: ../agents/moderator.yaml
      - id: schedule_agent
        ref: ../agents/schedule.yaml
  workflow:
    entry: moderator
    nodes:
      - id: moderator
        delegates_to:
          - schedule_agent
          - itinerary_agent
          - concierge_agent
      - id: schedule_agent
      - id: itinerary_agent
      - id: concierge_agent
