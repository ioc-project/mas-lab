apiVersion: mas/v1
kind: Tool

metadata:
  name: calc
  description: "Simple arithmetic calculator."
  version: "1.0.0"
  tags: [math]

spec:
  description: >
    Evaluate a basic arithmetic expression and return the numeric result.
    Use it for any sum, ratio or product instead of computing it yourself.
    Supports +, -, *, / and parentheses. No external calls.

  parameters:
    - name: expression
      type: string
      description: "Arithmetic expression to evaluate (e.g. '14 / 2.1')."
      required: true
      examples: ["28 + 22", "14 / 2.1", "(55 + 33) * 2"]

  impl:
    kind: python
    module_path: ./calc.py
    class_name: CalcTool
