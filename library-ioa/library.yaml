# IOA library — MCP tool-provider plugin for MAS Lab.
apiVersion: mas/v1
kind: Library

name: ioa
description: >
  MCP client/server bridge, A2A agent_comm / agent_expose, and stack layers: SLIM and HTTP
  transports, and A2A framing above either.
version: "0.1.0"
dependencies:
  - mcp>=2.2
  - a2a-sdk[http-server,sqlite]>=1.1.5
  - uvicorn>=0.30

module_base: library_ioa

types:
  - tool_provider
  - agent_comm
  - agent_expose
  - layer
  - webserver
  - transport_classifier

plugins:
  - type: tool_provider
    name: mcp
    urn: mas.tool_provider.mcp
    module: library_ioa.plugins.mcp.provider
    class: MCPToolProvider
    shortcuts:
      - mcp
    attributes:
      protocol_name: mcp
      url_schemes: {mcp: http, mcps: https}
      connect_as: tool_server
      listen_hint: serve an MCP tool with mas-mcp
  - type: layer
    name: mcp
    urn: mas.layer.mcp
    module: library_ioa.plugins.mcp.layer
    class: McpLayer
    shortcuts:
      - mcp
    attributes:
      per: destination
      call_kinds: [tool]
      priority: 0
      protocol_layer: true
  - type: agent_comm
    name: a2a
    urn: mas.agent_comm.a2a
    module: library_ioa.plugins.a2a.agent_comm
    class: A2AAgentComm
    warm:
      - a2a.client
      - a2a.server.agent_execution
      - a2a.server.events
      - a2a.server.request_handlers
      - a2a.server.routes
      - a2a.server.tasks
      - a2a.utils.grpc_status
      - a2a.types.a2a_pb2_grpc
      - a2a.server.request_handlers.grpc_handler
      - grpc
      - grpc.aio
      - google.rpc.status_pb2
      - fastapi
    attributes:
      protocol_name: a2a
      url_schemes: {a2a: http, a2as: https}
      connect_as: endpoint
      listen: true
  - type: agent_expose
    name: a2a
    urn: mas.agent_expose.a2a
    module: library_ioa.plugins.a2a.exposure
    class: A2AExposure
  - type: layer
    name: slim
    urn: mas.layer.slim
    module: library_ioa.plugins.slim.agent_comm
    class: SlimAgentComm
    shortcuts:
      - slim
    attributes:
      default_enabled: false
  - type: layer
    name: a2a-framing
    urn: mas.layer.a2a-framing
    module: library_ioa.plugins.a2a.layer
    class: A2ALayer
    attributes:
      default_enabled: false
  - type: layer
    name: http
    urn: mas.layer.http
    module: library_ioa.plugins.http_layer.transport
    class: HttpLayer
    shortcuts:
      - http
    attributes:
      default_enabled: false
      role: transport
      call_kinds: [send, llm, tool]
  - type: webserver
    name: uvicorn
    urn: mas.webserver.uvicorn
    module: library_ioa.plugins.webserver
    class: UvicornWebServer
  - type: transport_classifier
    name: a2a
    urn: mas.transport_classifier.a2a
    module: library_ioa.plugins.a2a.classifier
    class: A2ATransportClassifier
    attributes:
      default_sdk_spans: false
      default_propagate_metadata: false
  - type: transport_classifier
    name: mcp
    urn: mas.transport_classifier.mcp
    module: library_ioa.plugins.mcp.classifier
    class: MCPTransportClassifier
    attributes:
      default_sdk_spans: false
      default_propagate_metadata: false
  - type: transport_classifier
    name: slim
    urn: mas.transport_classifier.slim
    module: library_ioa.plugins.slim.classifier
    class: SlimTransportClassifier
    attributes:
      default_sdk_spans: false
      default_propagate_metadata: false
