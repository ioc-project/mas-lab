# IOA library — MCP tool-provider plugin for MAS Lab.
apiVersion: mas/v1
kind: Library

name: ioa
description: >
  MCP client/server bridge, A2A agent_comm / agent_expose, and stack layers: SLIM and HTTP
  transports, and A2A framing above either.
version: "0.1.0"
dependencies:
  - mcp>=2.2
  - a2a-sdk[http-server,sqlite]>=1.1.5
  - uvicorn>=0.30

module_base: library_ioa

types:
  - tool_provider
  - agent_comm
  - agent_expose
  - layer
  - stack_layer
  - webserver

plugins:
  - type: tool_provider
    name: mcp
    urn: mas.tool_provider.mcp
    module: library_ioa.plugins.mcp.provider
    class: MCPToolProvider
    shortcuts:
      - mcp
  - type: agent_comm
    name: a2a
    urn: mas.agent_comm.a2a
    module: library_ioa.plugins.a2a.agent_comm
    class: A2AAgentComm
  - type: agent_expose
    name: a2a
    urn: mas.agent_expose.a2a
    module: library_ioa.plugins.a2a.exposure
    class: A2AExposure
  - type: layer
    name: slim
    urn: mas.stack_layer.slim
    module: library_ioa.plugins.slim.agent_comm
    class: SlimAgentComm
    shortcuts:
      - slim
    attributes:
      default_enabled: false
      semantic: stack_layer
      deprecated_types: [stack_layer]
  - type: layer
    name: a2a-framing
    urn: mas.stack_layer.a2a-framing
    module: library_ioa.plugins.a2a.layer
    class: A2ALayer
    attributes:
      default_enabled: false
      semantic: stack_layer
      deprecated_types: [stack_layer]
  - type: layer
    name: http
    urn: mas.stack_layer.http
    module: library_ioa.plugins.http_layer.transport
    class: HttpLayer
    shortcuts:
      - http
    attributes:
      default_enabled: false
      semantic: stack_layer
      deprecated_types: [stack_layer]
  - type: webserver
    name: uvicorn
    urn: mas.webserver.uvicorn
    module: library_ioa.plugins.webserver
    class: UvicornWebServer
